name: Arkus Merge Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arkus-merge-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  required-merge-gate:
    name: Required merge gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      - name: Setup Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'

      - name: Verify exact SDK selection
        shell: bash
        run: |
          set -euo pipefail
          required="$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('global.json').read_text(encoding='utf-8'))['sdk']['version'])
          PY
          )"
          actual="$(dotnet --version)"
          test "${actual}" = "${required}" || {
            echo "::error::global.json requires ${required}; setup-dotnet selected ${actual}"
            exit 2
          }

      - name: Restore
        run: dotnet restore Juego2.sln

      - name: Build release
        run: dotnet build Juego2.sln --no-restore -c Release

      - name: Test release
        run: dotnet test Juego2.sln --no-build --no-restore -c Release --logger "console;verbosity=minimal"

      - name: Compile Python process checkers
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          from pathlib import Path
          for path in sorted(Path('scripts').glob('*.py')):
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY

      - name: Process causal self-tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate-worker-handoff.py --self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation-context.py self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate-worker-preflight-context.py --self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate-main-safety-trigger.py --self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate-worker-preflight-contract.py --self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/workpack-verifier.py self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/reuse-context.py self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/review-claim.py self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/batch-c-review-claim-controls.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/context-capsule-check.py --self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/pa-disposition-selector-controls.py
