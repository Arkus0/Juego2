name: Agentic Transition Markers

on:
  pull_request:
    types: [ready_for_review, closed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  ready-marker:
    if: github.event_name == 'pull_request' && github.event.action == 'ready_for_review'
    runs-on: ubuntu-24.04
    steps:
      - name: Persist REVIEW_PENDING marker
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          key="review-pending:${PR}:${SHA}"
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate --jq '.[].body' | grep -Fq "Key: ${key}"; then
            exit 0
          fi
          body=$(printf 'AGENTIC_TRANSITION_V1\nState: REVIEW_PENDING\nKey: %s\nTarget SHA: %s\n' "$key" "$SHA")
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body" >/dev/null

  review-marker:
    if: >-
      github.event_name == 'pull_request_review' &&
      (github.event.review.author_association == 'OWNER' || github.event.review.author_association == 'MEMBER' || github.event.review.author_association == 'COLLABORATOR')
    runs-on: ubuntu-24.04
    steps:
      - name: Persist review transition marker
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_BODY: ${{ github.event.review.body }}
        shell: python
        run: |
          import json, os, re, subprocess
          body = os.environ.get('REVIEW_BODY') or ''
          verdict = None
          if re.search(r'Reviewer verdict:\s*FAIL\b', body, re.I): verdict = 'REPAIR_PENDING'
          elif re.search(r'Reviewer verdict:\s*PASS\b', body, re.I): verdict = 'FINALIZATION_PENDING'
          else:
              print('No canonical PASS/FAIL marker; noop.')
              raise SystemExit(0)
          m = re.search(r'Reviewed candidate SHA:\s*`?([0-9a-fA-F]{40})`?', body, re.I)
          if not m:
              print('Canonical verdict requires Reviewed candidate SHA; noop.')
              raise SystemExit(0)
          sha = m.group(1).lower()
          pr = os.environ['PR']
          key = f'{verdict.lower()}:{pr}:{sha}'
          existing = subprocess.run(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/issues/{pr}/comments','--paginate','--jq','.[].body'],capture_output=True,text=True,check=True).stdout
          if f'Key: {key}' in existing:
              raise SystemExit(0)
          marker = f'AGENTIC_TRANSITION_V1\nState: {verdict}\nKey: {key}\nTarget SHA: {sha}\n'
          subprocess.run(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/issues/{pr}/comments','-f',f'body={marker}'],check=True)

  docsync-marker:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && !contains(github.event.pull_request.body || '', 'WORKFLOW_MODE: PROCESS_ONLY')
    runs-on: ubuntu-24.04
    steps:
      - name: Persist DOCSYNC_PENDING marker
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          key="docsync-pending:${PR}:${MERGE_SHA}"
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate --jq '.[].body' | grep -Fq "Key: ${key}"; then
            exit 0
          fi
          body=$(printf 'AGENTIC_TRANSITION_V1\nState: DOCSYNC_PENDING\nKey: %s\nTarget SHA: %s\n' "$key" "$MERGE_SHA")
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body" >/dev/null
