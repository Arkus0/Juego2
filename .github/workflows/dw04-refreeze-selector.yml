name: DW-04 Pre-execution Selector Refreeze

on:
  pull_request:
    types: [edited]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: dw04-refreeze-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  refreeze:
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.body || '', 'DW04 refreeze: selector-uniqueness')
    runs-on: ubuntu-24.04
    env:
      OLD_FREEZE: 0c57a766f8b25e0c1e22d746c05a5678ae275841
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout exact pre-refreeze candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Prove objective pre-call repair boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git merge-base --is-ancestor "${OLD_FREEZE}" HEAD
          test ! -e Docs/evidence/WP-DW-04/CONTEXT_ASSEMBLY.json
          test "$(git rev-parse HEAD:Docs/evidence/WP-DW-04/TASK_SELECTION_FREEZE.json)" = "$(git rev-parse ${OLD_FREEZE}:Docs/evidence/WP-DW-04/TASK_SELECTION_FREEZE.json)"
          old_plan="$(jq -r '.context_plan_blob' Docs/evidence/WP-DW-04/TASK_SELECTION_FREEZE.json)"
          test "$(git rev-parse HEAD:Docs/evidence/WP-DW-04/ACCEPTANCE_CONTEXT_PLAN.json)" = "${old_plan}"
          test "$(jq -r '.selected|join(",")' Docs/evidence/WP-DW-04/TASK_SELECTION_FREEZE.json)" = 'A-CITY-01,A-CITY-02,A-CITY-03,A-PA-01,A-PA-02,A-PA-03'

      - name: Apply exactly one nonsemantic selector correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          path=pathlib.Path('Docs/evidence/WP-DW-04/ACCEPTANCE_CONTEXT_PLAN.json')
          data=json.loads(path.read_text())
          item=next(x for x in data['context_plan']['A-CITY-02']['CTX'] if x['id']=='city02-puerto-landing-row')
          old='| `loc.puerto.landing` |'
          new='| `loc.puerto.landing` | Puerto Fluvial | X6/X7 landing / upstream port threshold |'
          assert item['extract']=={'mode':'line_contains','needle':old}, item
          item['extract']['needle']=new
          path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':'))+'\n')
          PY
          cat > Docs/evidence/WP-DW-04/ACCEPTANCE_PREEXECUTION_AMENDMENT_01.md <<'EOF'
          # DW-04 acceptance pre-execution amendment 01 — selector uniqueness

          Status: mechanical pre-execution correction; no acceptance provider/model call has occurred.

          The first deterministic post-freeze assembly attempt (GitHub Actions run `35848658608`) stopped before context measurement and before any model call because the CTX `A-CITY-02` selector `| `loc.puerto.landing` |` matched both the authoritative §4 programme row and the later §5 systemic-use-profile row.

          This amendment changes exactly one extraction needle in `ACCEPTANCE_CONTEXT_PLAN.json` so it uniquely selects the already intended §4 programme row by including the §4 row's `Puerto Fluvial` and `X6/X7 landing / upstream port threshold` columns. It does not change the selected task, semantic question, authority file, expected facts/blockers/verdict/evidence, CTX meaning, DW query/fallback meaning, model/provider/configuration, answer schema, scorer, 36-slot order, correctness rule, byte threshold, or acceptance retry policy.

          The failed assembly produced no `CONTEXT_ASSEMBLY.json`, no scorable route result, no provider request ID and no acceptance model observation. Therefore the correction is independent of acceptance outcome. The superseded freeze remains in Git history; a new freeze re-content-addresses the corrected plan before assembly is attempted again. This is a Worker/owner-directed mechanical pre-execution amendment, not an independent Reviewer approval; the later Reviewer must assess its acceptability.
          EOF

      - name: Commit corrected plan and amendment before new freeze
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Docs/evidence/WP-DW-04/ACCEPTANCE_CONTEXT_PLAN.json Docs/evidence/WP-DW-04/ACCEPTANCE_PREEXECUTION_AMENDMENT_01.md
          git commit -m 'dw04: make frozen puerto selector mechanically unique'
          echo "REFREEZE_PARENT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Reissue identical semantic freeze over corrected plan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, os, subprocess
          freeze_path=pathlib.Path('Docs/evidence/WP-DW-04/TASK_SELECTION_FREEZE.json')
          f=json.loads(freeze_path.read_text())
          assert f['schema']=='dw04-acceptance-freeze-v3'
          assert f['selected']==['A-CITY-01','A-CITY-02','A-CITY-03','A-PA-01','A-PA-02','A-PA-03']
          new_plan=subprocess.check_output(['git','rev-parse','HEAD:Docs/evidence/WP-DW-04/ACCEPTANCE_CONTEXT_PLAN.json']).decode().strip()
          assert new_plan != f['context_plan_blob']
          f['freeze_parent']=os.environ['REFREEZE_PARENT']
          f['context_plan_blob']=new_plan
          f['supersedes_freeze_commit']='0c57a766f8b25e0c1e22d746c05a5678ae275841'
          f['preexecution_amendment']='Docs/evidence/WP-DW-04/ACCEPTANCE_PREEXECUTION_AMENDMENT_01.md'
          f['proof_boundary']='No acceptance CTX or DW model call occurred before this replacement freeze. The only change from the superseded freeze is the mechanically unique extraction needle documented in ACCEPTANCE_PREEXECUTION_AMENDMENT_01.md; all semantic and execution policy remains unchanged and content-addressed.'
          freeze_path.write_text(json.dumps(f,ensure_ascii=False,separators=(',',':'))+'\n')
          PY
          git add Docs/evidence/WP-DW-04/TASK_SELECTION_FREEZE.json
          git commit -m 'dw04: refreeze unchanged acceptance semantics after selector fix'
          echo "NEW_FREEZE=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Retarget assembly-only workflow to replacement freeze
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, os
          p=pathlib.Path('.github/workflows/dw04-assemble.yml')
          text=p.read_text()
          old='0c57a766f8b25e0c1e22d746c05a5678ae275841'
          new=os.environ['NEW_FREEZE']
          assert text.count(old)==2, text.count(old)
          p.write_text(text.replace(old,new))
          PY
          git add .github/workflows/dw04-assemble.yml
          git commit -m 'dw04: retarget deterministic assembly to replacement freeze'

      - name: Push pre-call repaired lineage
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${HEAD_BRANCH}"
