name: DW-04 Pre-execution Selector Refreeze

on:
  pull_request:
    types: [edited]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: dw04-refreeze-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  refreeze:
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.body || '', 'DW04 refreeze: city-selector-class-02')
    runs-on: ubuntu-24.04
    env:
      OLD_FREEZE: 960ef57ce2ae99c6499fbc6cd2e9391181c20d86
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout exact pre-refreeze candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Prove objective pre-call repair boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git merge-base --is-ancestor "${OLD_FREEZE}" HEAD
          test ! -e Docs/evidence/WP-DW-04/CONTEXT_ASSEMBLY.json
          test "$(git rev-parse HEAD:Docs/evidence/WP-DW-04/TASK_SELECTION_FREEZE.json)" = "$(git rev-parse ${OLD_FREEZE}:Docs/evidence/WP-DW-04/TASK_SELECTION_FREEZE.json)"
          old_plan="$(jq -r '.context_plan_blob' Docs/evidence/WP-DW-04/TASK_SELECTION_FREEZE.json)"
          test "$(git rev-parse HEAD:Docs/evidence/WP-DW-04/ACCEPTANCE_CONTEXT_PLAN.json)" = "${old_plan}"
          test "$(jq -r '.selected|join(",")' Docs/evidence/WP-DW-04/TASK_SELECTION_FREEZE.json)" = 'A-CITY-01,A-CITY-02,A-CITY-03,A-PA-01,A-PA-02,A-PA-03'

      - name: Close the remaining CITY section-4 selector class
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          path=pathlib.Path('Docs/evidence/WP-DW-04/ACCEPTANCE_CONTEXT_PLAN.json')
          data=json.loads(path.read_text())
          cases={
            ('A-CITY-01','city02-shared-court-row'):(
              '| `loc.casco.shared_court` |',
              '| `loc.casco.shared_court` | Casco Viejo | passage + shared court / stair relation |'),
            ('A-CITY-03','city02-town-hall-row'):(
              '| `loc.plaza.ayuntamiento` |',
              '| `loc.plaza.ayuntamiento` | Plaza y Ayuntamiento | town hall / civic office |'),
          }
          for (task,fid),(old,new) in cases.items():
              item=next(x for x in data['context_plan'][task]['CTX'] if x['id']==fid)
              assert item['extract']=={'mode':'line_contains','needle':old}, (task,item)
              item['extract']['needle']=new
          puerto=next(x for x in data['context_plan']['A-CITY-02']['CTX'] if x['id']=='city02-puerto-landing-row')
          assert puerto['extract']['needle']=='| `loc.puerto.landing` | Puerto Fluvial | X6/X7 landing / upstream port threshold |'
          path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':'))+'\n')
          PY
          cat > Docs/evidence/WP-DW-04/ACCEPTANCE_PREEXECUTION_AMENDMENT_02.md <<'EOF'
          # DW-04 acceptance pre-execution amendment 02 — close CITY §4 selector class

          Status: mechanical pre-execution correction; acceptance provider/model usage remains 0/36.

          Deterministic assembly had already proved two members of the same selector defect class before any model call: the original freeze failed on `loc.puerto.landing`, and replacement freeze `960ef57ce2ae99c6499fbc6cd2e9391181c20d86` failed in run `35849331838` / job `107143000824` on `loc.plaza.ayuntamiento`. In both cases a short `line_contains` needle matched the intended §4 programme row and a later table repeating the same programme identifier.

          This amendment closes that entire known CITY §4 class by making the two remaining short §4 row needles (`loc.casco.shared_court`, `loc.plaza.ayuntamiento`) uniquely identify their already intended §4 ledger rows. The already-corrected Puerto needle is preserved. No task identity, semantic question, authority file, expected fact/blocker/verdict/evidence, CTX or DW meaning, model/provider/configuration, answer schema, scorer, 36-slot order, correctness rule, byte threshold or retry policy changes.

          Both failed assemblies stopped before context measurement completion and before provider execution; neither produced an acceptance model response or provider request ID. The replacement freeze therefore remains pre-result. This is owner/Worker-directed mechanical pre-execution repair, not independent Reviewer approval.
          EOF

      - name: Commit corrected plan and amendment before replacement freeze
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Docs/evidence/WP-DW-04/ACCEPTANCE_CONTEXT_PLAN.json Docs/evidence/WP-DW-04/ACCEPTANCE_PREEXECUTION_AMENDMENT_02.md
          git commit -m 'dw04: close CITY section-4 selector ambiguity class'
          echo "REFREEZE_PARENT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Reissue identical semantic freeze over corrected plan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, os, subprocess
          freeze_path=pathlib.Path('Docs/evidence/WP-DW-04/TASK_SELECTION_FREEZE.json')
          f=json.loads(freeze_path.read_text())
          assert f['schema']=='dw04-acceptance-freeze-v3'
          assert f['selected']==['A-CITY-01','A-CITY-02','A-CITY-03','A-PA-01','A-PA-02','A-PA-03']
          new_plan=subprocess.check_output(['git','rev-parse','HEAD:Docs/evidence/WP-DW-04/ACCEPTANCE_CONTEXT_PLAN.json']).decode().strip()
          assert new_plan != f['context_plan_blob']
          f['freeze_parent']=os.environ['REFREEZE_PARENT']
          f['context_plan_blob']=new_plan
          f['supersedes_freeze_commit']='960ef57ce2ae99c6499fbc6cd2e9391181c20d86'
          f['preexecution_amendment']='Docs/evidence/WP-DW-04/ACCEPTANCE_PREEXECUTION_AMENDMENT_02.md'
          f['proof_boundary']='Acceptance provider/model usage is 0/36. This replacement freeze changes only the mechanically unique CITY §4 extraction needles documented in ACCEPTANCE_PREEXECUTION_AMENDMENT_02.md; all task semantics, source oracles, model/configuration and decision policy remain unchanged.'
          freeze_path.write_text(json.dumps(f,ensure_ascii=False,separators=(',',':'))+'\n')
          PY
          git add Docs/evidence/WP-DW-04/TASK_SELECTION_FREEZE.json
          git commit -m 'dw04: refreeze unchanged semantics after CITY selector-class fix'
          echo "NEW_FREEZE=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Push replacement freeze lineage
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${HEAD_BRANCH}"
