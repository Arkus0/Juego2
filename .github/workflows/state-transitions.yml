name: Arkus State Transitions

on:
  workflow_run:
    workflows: ["Arkus Candidate Validation"]
    types: [completed]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  review-ready:
    name: Mark review ready
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout process oracle
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: process-oracle
          fetch-depth: 1

      - name: Validate context-bound handoff and persist intermediate marker
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PR:-}" ]] || exit 0
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" > pr.json
          pr_body="$(jq -r '.body // ""' pr.json)"
          if ! printf '%s\n' "${pr_body}" | grep -Eqi '^(WP|Contract|Worker state|Candidate HEAD SHA|Worker pre-review|Frozen candidate SHA|Branch frozen):'; then exit 0; fi
          [[ "$(jq -r '.head.sha' pr.json)" == "${RUN_SHA}" ]] || exit 0
          [[ "$(jq -r '.draft' pr.json)" == "false" ]] || exit 0

          python3 process-oracle/scripts/validation-context.py self-test
          python3 process-oracle/scripts/validation-context.py resolve \
            --pr-json pr.json --target-sha "${RUN_SHA}" --record current-context.json >/dev/null
          wp="$(jq -r '.wp' current-context.json)"
          process_only="$(jq -r '.process_only' current-context.json)"
          non_foundational="$(jq -r '.non_foundational' current-context.json)"
          digest="$(jq -r '.context_digest' current-context.json)"

          python3 - <<'PY'
          import json, re
          pr = json.load(open('pr.json', encoding='utf-8'))
          body = pr.get('body') or ''
          def field(name):
              rows = re.findall(rf'^{re.escape(name)}:\s*`?([^`\r\n]+?)`?\s*$', body, re.M | re.I)
              if len(rows) != 1: raise SystemExit(f'{name} must occur exactly once')
              return rows[0].strip()
          for key, expected in {'Worker state':'FROZEN_FOR_REVIEW','Branch frozen':'YES','Worker verdict':'IN_REVIEW','Worker pre-review':'CLEAN','Reviewer verdict':'PENDING'}.items():
              if field(key).upper() != expected: raise SystemExit(f'{key} mismatch')
          head = pr['head']['sha'].lower()
          if field('Candidate HEAD SHA').lower() != head or field('Frozen candidate SHA').lower() != head:
              raise SystemExit('Candidate/Frozen SHA must equal PR HEAD')
          PY

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" > run-jobs.json
          handoff_job="$(jq -r '[.jobs[] | select(.name == "Worker handoff lint")] | last | .conclusion // "missing"' run-jobs.json)"
          context_job="$(jq -r '[.jobs[] | select(.name == "Validation context binding")] | last | .conclusion // "missing"' run-jobs.json)"
          freeze_job="$(jq -r '[.jobs[] | select(.name == "Freeze exact-SHA validation")] | last | .conclusion // "missing"' run-jobs.json)"
          [[ "${handoff_job}" == "success" && "${context_job}" == "success" ]] || exit 0
          if [[ "${non_foundational}" != "true" ]]; then [[ "${freeze_job}" == "success" ]] || exit 0; fi

          gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/${RUN_SHA}/check-runs?per_page=100" > checks.json
          external_id="validation-context:${PR}:${RUN_SHA}:${digest}:${RUN_ID}"
          match_count="$(jq -r --arg eid "${external_id}" '[.check_runs[] | select(.name == "Validation context identity" and .conclusion == "success" and .external_id == $eid)] | length' checks.json)"
          [[ "${match_count}" -ge 1 ]] || { echo "::error::No context-bound identity for run ${RUN_ID}"; exit 2; }

          key="review-ready:${PR}:${RUN_SHA}:${digest}"
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" --paginate --jq '.[].body' | grep -Fq "Key: ${key}"; then exit 0; fi
          detail="context-bound Worker handoff and applicable exact-SHA validation are green. Terminal closure must still revalidate the marker before any Reviewer notification."
          body=$(cat <<EOF
          ARKUS_AUTOMATION_V2
          State: REVIEW_READY
          Key: ${key}
          Target SHA: ${RUN_SHA}
          Effective WP: ${wp}
          Process Only: ${process_only}
          Non Foundational: ${non_foundational}
          Validation Context Digest: ${digest}
          Validation Run ID: ${RUN_ID}
          Validation Workflow: Arkus Candidate Validation
          Detail: ${detail}
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="${body}" >/dev/null
          # Raw REVIEW_READY is deliberately not dispatched. REVIEW_READY_CLOSED
          # is the single user-actionable Reviewer transition.

  review-transition:
    name: Process reviewer verdict
    if: >-
      (github.event_name == 'pull_request_review' &&
       (github.event.review.author_association == 'OWNER' ||
        github.event.review.author_association == 'MEMBER' ||
        github.event.review.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout process oracle
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: process-oracle
          fetch-depth: 1

      - name: Validate exact verdict and transition
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          REVIEW_BODY: ${{ github.event.review.body || github.event.comment.body }}
          REVIEW_AT: ${{ github.event.review.submitted_at || github.event.comment.created_at }}
        shell: bash
        run: |
          set -euo pipefail
          read -r verdict reviewed_sha < <(python3 - <<'PY'
          import os, re
          body = os.environ.get('REVIEW_BODY') or ''
          verdicts, shas = [], []
          for raw in body.splitlines():
              line = re.sub(r'^#{1,6}\s*', '', raw.strip()).replace('**','').replace('__','').replace('`','').strip()
              vm = re.fullmatch(r'Reviewer verdict:\s*(PASS|FAIL)\.?', line, re.I)
              sm = re.fullmatch(r'Reviewed candidate SHA:\s*([0-9a-fA-F]{40})\.?', line, re.I)
              if vm: verdicts.append(vm.group(1).upper())
              if sm: shas.append(sm.group(1).lower())
          print(verdicts[0], shas[0]) if len(verdicts) == len(shas) == 1 else print('NONE NONE')
          PY
          )
          [[ "${verdict}" != "NONE" ]] || exit 0
          [[ -n "${REVIEW_AT:-}" ]] || { echo "::error::Reviewer verdict timestamp unavailable"; exit 2; }

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" > pr.json
          frozen_sha="$(python3 - <<'PY'
          import json, re
          pr = json.load(open('pr.json', encoding='utf-8'))
          body = pr.get('body') or ''
          if pr.get('merged') or pr.get('draft'): raise SystemExit('PR must be open and Ready')
          def field(name):
              rows = re.findall(rf'^{re.escape(name)}:\s*`?([^`\r\n]+?)`?\s*$', body, re.M | re.I)
              if len(rows) != 1: raise SystemExit(f'{name} must occur exactly once')
              return rows[0].strip()
          for key, expected in {'Worker state':'FROZEN_FOR_REVIEW','Branch frozen':'YES','Worker verdict':'IN_REVIEW','Worker pre-review':'CLEAN'}.items():
              if field(key).upper() != expected: raise SystemExit(f'{key} mismatch')
          head = pr['head']['sha'].lower(); frozen = field('Frozen candidate SHA').lower()
          if frozen != head: raise SystemExit('Frozen candidate SHA must equal PR HEAD')
          print(frozen)
          PY
          )"
          [[ "${reviewed_sha}" == "${frozen_sha}" ]] || { echo "::error::Reviewed SHA ${reviewed_sha} != frozen SHA ${frozen_sha}"; exit 2; }

          python3 process-oracle/scripts/validation-context.py self-test
          python3 process-oracle/scripts/validation-context.py resolve \
            --pr-json pr.json --target-sha "${reviewed_sha}" --record current-context.json >/dev/null
          digest="$(jq -r '.context_digest' current-context.json)"

          if [[ "${verdict}" == "FAIL" ]]; then
            key="repair-required:${PR}:${reviewed_sha}:${digest}"
            if ! gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" --paginate --jq '.[].body' | grep -Fq "Key: ${key}"; then
              body=$(cat <<EOF
          ARKUS_AUTOMATION_V2
          State: REPAIR_REQUIRED
          Key: ${key}
          Target SHA: ${reviewed_sha}
          Validation Context Digest: ${digest}
          Detail: independent Reviewer FAIL. Start a fresh repair Worker on the same WP; do not advance downstream.
          EOF
              )
              gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="${body}" >/dev/null
            fi
            exit 0
          fi

          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" | jq '[.[][]]' > comments.json
          python3 process-oracle/scripts/review-ready-binding.py self-test
          python3 process-oracle/scripts/review-ready-binding.py select \
            --comments-json comments.json --pr-json pr.json --context-record current-context.json \
            --target-sha "${reviewed_sha}" --before "${REVIEW_AT}" \
            --record review-binding.json --marker-record marker.json >/dev/null
          binding_digest="$(jq -r '.binding_digest' review-binding.json)"
          closed_key="$(jq -r '.review_ready_closed_key' review-binding.json)"
          validation_run_id="$(jq -r '.validation_run_id' review-binding.json)"
          validation_workflow="$(jq -r '.validation_workflow' review-binding.json)"
          non_foundational="$(jq -r '.non_foundational' review-binding.json)"

          python3 - "${closed_key}" "${reviewed_sha}" "${binding_digest}" "${validation_run_id}" "${validation_workflow}" "${REVIEW_AT}" <<'PY'
          import json, re, sys
          comments = json.load(open('comments.json', encoding='utf-8'))
          key, sha, binding, run_id, workflow, before = sys.argv[1:]
          found = []
          for c in comments:
              if (c.get('user') or {}).get('login') != 'github-actions[bot]': continue
              if c.get('created_at','') > before: continue
              body = c.get('body') or ''
              def one(name):
                  rows = re.findall(rf'^{re.escape(name)}:\s*(.*?)\s*$', body, re.M)
                  return rows[0].strip() if len(rows) == 1 else None
              if one('State') != 'REVIEW_READY_CLOSED': continue
              if one('Key') != key or one('Target SHA') != sha: continue
              if one('Review Binding Digest') != binding: continue
              if one('Validation Run ID') != run_id or one('Validation Workflow') != workflow: continue
              found.append(c)
          if not found: raise SystemExit('No matching REVIEW_READY_CLOSED marker predating Reviewer verdict')
          PY

          gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/${reviewed_sha}/check-runs?per_page=100" > checks.json
          external_id="validation-context:${PR}:${reviewed_sha}:${binding_digest}:${validation_run_id}"
          match_count="$(jq -r --arg eid "${external_id}" '[.check_runs[] | select(.name == "Validation context identity" and .conclusion == "success" and .external_id == $eid)] | length' checks.json)"
          [[ "${match_count}" -ge 1 ]] || { echo "::error::No validation identity matching terminal review binding"; exit 2; }
          jq -r --arg eid "${external_id}" '[.check_runs[] | select(.name == "Validation context identity" and .conclusion == "success" and .external_id == $eid)] | sort_by(.completed_at // .started_at // "") | last | .output.summary' checks.json > context-summary.txt
          python3 process-oracle/scripts/validation-context.py check-match \
            --pr-json pr.json --target-sha "${reviewed_sha}" --summary context-summary.txt \
            --run-id "${validation_run_id}" --workflow "${validation_workflow}" >/dev/null

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${validation_run_id}" > validation-run.json
          [[ "$(jq -r '.name // empty' validation-run.json)" == "${validation_workflow}" ]] || { echo "::error::Validation source workflow mismatch"; exit 2; }
          [[ "$(jq -r '.conclusion // empty' validation-run.json)" == "success" ]] || { echo "::error::Validation source run is not GREEN"; exit 2; }
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${validation_run_id}/jobs?per_page=100" > validation-jobs.json
          if [[ "${validation_workflow}" == "Arkus Candidate Validation" ]]; then
            [[ "$(jq -r '.head_sha // empty' validation-run.json)" == "${reviewed_sha}" ]] || { echo "::error::Validation source SHA mismatch"; exit 2; }
            handoff_job="$(jq -r '[.jobs[] | select(.name == "Worker handoff lint")] | last | .conclusion // "missing"' validation-jobs.json)"
            context_job="$(jq -r '[.jobs[] | select(.name == "Validation context binding")] | last | .conclusion // "missing"' validation-jobs.json)"
            freeze_job="$(jq -r '[.jobs[] | select(.name == "Freeze exact-SHA validation")] | last | .conclusion // "missing"' validation-jobs.json)"
            [[ "${handoff_job}" == "success" && "${context_job}" == "success" ]] || { echo "::error::Context-bound validation jobs are not GREEN"; exit 2; }
            if [[ "${non_foundational}" != "true" ]]; then [[ "${freeze_job}" == "success" ]] || { echo "::error::Required freeze is not GREEN"; exit 2; }; fi
          else
            reuse_job="$(jq -r '[.jobs[] | select(.name == "Reuse exact-SHA receipt for freeze")] | last | .conclusion // "missing"' validation-jobs.json)"
            [[ "${reuse_job}" == "success" ]] || { echo "::error::Receipt reuse job is not GREEN"; exit 2; }
          fi

          candidate_root="${RUNNER_TEMP}/pass-preflight-candidate"
          rm -rf "${candidate_root}"; mkdir -p "${candidate_root}"
          git -C process-oracle fetch --no-tags --depth=1 origin "${reviewed_sha}"
          [[ "$(git -C process-oracle rev-parse FETCH_HEAD)" == "${reviewed_sha}" ]] || { echo "::error::Could not fetch exact reviewed candidate"; exit 2; }
          git -C process-oracle archive "${reviewed_sha}" | tar -x -C "${candidate_root}"

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" > pr-final.json
          python3 process-oracle/scripts/validation-context.py record-match --pr-json pr-final.json --target-sha "${reviewed_sha}" --record current-context.json >/dev/null
          [[ "$(jq -r '.draft' pr-final.json)" == "false" ]] || { echo "::error::PR became Draft during PASS preflight"; exit 2; }
          python3 process-oracle/scripts/pass-preflight-handoff.py --self-test
          python3 process-oracle/scripts/pass-preflight-handoff.py --pr-json pr-final.json --target-sha "${reviewed_sha}" --repo-root "${candidate_root}"

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" > pr-merge.json
          python3 process-oracle/scripts/validation-context.py record-match --pr-json pr-merge.json --target-sha "${reviewed_sha}" --record current-context.json >/dev/null
          [[ "$(jq -r '.draft' pr-merge.json)" == "false" ]] || { echo "::error::PR became Draft immediately before merge"; exit 2; }
          python3 process-oracle/scripts/pass-preflight-handoff.py --pr-json pr-merge.json --target-sha "${reviewed_sha}" --repo-root "${candidate_root}"

          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR}/merge" -f sha="${reviewed_sha}" -f merge_method=merge > merge.json
          [[ "$(jq -r '.merged // false' merge.json)" == "true" ]] || { echo "::error::Exact-SHA merge was rejected"; cat merge.json; exit 2; }

          key="pass-merge:${PR}:${reviewed_sha}:${binding_digest}"
          if ! gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" --paginate --jq '.[].body' | grep -Fq "Key: ${key}"; then
            body=$(cat <<EOF
          ARKUS_AUTOMATION_V2
          State: PASS_PREFLIGHT_GREEN
          Key: ${key}
          Target SHA: ${reviewed_sha}
          Review Binding Digest: ${binding_digest}
          Validation Run ID: ${validation_run_id}
          Validation Workflow: ${validation_workflow}
          Detail: Reviewer PASS, terminal REVIEW_READY_CLOSED, current validation identity and live canonical handoff oracle all agree on the exact reviewed candidate. Exact-SHA merge completed.
          EOF
            )
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="${body}" >/dev/null
          fi

  docsync-marker:
    name: Mark DocSync required
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - name: Persist post-merge marker
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        shell: bash
        run: |
          set -euo pipefail
          process_only=false
          if printf '%s\n' "${PR_BODY}" | grep -Eqi '^(Mode|WORKFLOW_MODE):[[:space:]]*`?PROCESS_ONLY`?[[:space:]]*$'; then process_only=true; fi
          has_worker_lifecycle=false
          if printf '%s\n' "${PR_BODY}" | grep -Eqi '^(WP|Contract|Worker state|Candidate HEAD SHA|Worker pre-review|Frozen candidate SHA|Branch frozen):'; then has_worker_lifecycle=true; fi
          if [[ "${process_only}" == "true" && "${has_worker_lifecycle}" != "true" ]]; then exit 0; fi
          key="docsync-required:${PR}:${MERGE_SHA}"
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" --paginate --jq '.[].body' | grep -Fq "Key: ${key}"; then exit 0; fi
          body=$(cat <<EOF
          ARKUS_AUTOMATION_V2
          State: DOCSYNC_REQUIRED
          Key: ${key}
          Target SHA: ${MERGE_SHA}
          Detail: implementation merged. Run DocSync before selecting the next WP.
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="${body}" >/dev/null
