name: Arkus State Transitions

on:
  workflow_run:
    workflows: ["Arkus Candidate Validation"]
    types: [completed]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  review-ready:
    name: Mark review ready
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout process oracle
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: process-oracle
          fetch-depth: 1

      - name: Validate context-bound handoff and persist marker
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        shell: bash
        run: |
          set -euo pipefail

          # CTX_DIRECT_REVIEW_READY_GATE_BEGIN
          direct_candidate_validation_gate() {
            local run_conclusion="$1"
            local handoff_job="$2"
            local context_job="$3"
            local freeze_job="$4"
            local non_foundational="$5"
            [[ "${non_foundational}" == "true" || "${non_foundational}" == "false" ]] &&
              [[ "${run_conclusion}" == "success" ]] &&
              [[ "${handoff_job}" == "success" ]] &&
              [[ "${context_job}" == "success" ]] &&
              [[ "${freeze_job}" == "success" ]]
          }
          # CTX_DIRECT_REVIEW_READY_GATE_END

          [[ -n "${PR:-}" ]] || exit 0

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" > pr.json
          pr_body="$(jq -r '.body // ""' pr.json)"
          if ! printf '%s\n' "${pr_body}" | grep -Eqi '^(WP|Contract|Worker state|Candidate HEAD SHA|Worker pre-review|Frozen candidate SHA|Branch frozen):'; then
            exit 0
          fi
          [[ "$(jq -r '.head.sha' pr.json)" == "${RUN_SHA}" ]] || exit 0
          [[ "$(jq -r '.draft' pr.json)" == "false" ]] || exit 0

          python3 process-oracle/scripts/validation-context.py self-test
          python3 process-oracle/scripts/validation-context.py resolve \
            --pr-json pr.json --target-sha "${RUN_SHA}" --record current-context.json >/dev/null
          wp="$(jq -r '.wp' current-context.json)"
          process_only="$(jq -r '.process_only' current-context.json)"
          non_foundational="$(jq -r '.non_foundational' current-context.json)"
          digest="$(jq -r '.context_digest' current-context.json)"

          python3 - <<'PY'
          import json, re
          pr = json.load(open('pr.json', encoding='utf-8'))
          body = pr.get('body') or ''
          def field(name):
              matches = re.findall(rf'^{re.escape(name)}:\s*`?([^`\r\n]+?)`?\s*$', body, re.M | re.I)
              if len(matches) != 1:
                  raise SystemExit(f'{name} must occur exactly once, found {len(matches)}')
              return matches[0].strip()
          for key, expected in {
              'Worker state': 'FROZEN_FOR_REVIEW',
              'Branch frozen': 'YES',
              'Worker verdict': 'IN_REVIEW',
              'Worker pre-review': 'CLEAN',
              'Reviewer verdict': 'PENDING',
          }.items():
              got = field(key)
              if got.upper() != expected:
                  raise SystemExit(f'{key} must be {expected}, got {got!r}')
          head = pr['head']['sha'].lower()
          if field('Candidate HEAD SHA').lower() != head or field('Frozen candidate SHA').lower() != head:
              raise SystemExit('Candidate/Frozen SHA must equal PR HEAD')
          PY

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" > run-jobs.json
          handoff_job="$(jq -r '[.jobs[] | select(.name == "Worker handoff lint")] | last | .conclusion // "missing"' run-jobs.json)"
          context_job="$(jq -r '[.jobs[] | select(.name == "Validation context binding")] | last | .conclusion // "missing"' run-jobs.json)"
          freeze_job="$(jq -r '[.jobs[] | select(.name == "Freeze exact-SHA validation")] | last | .conclusion // "missing"' run-jobs.json)"
          if ! direct_candidate_validation_gate "${RUN_CONCLUSION}" "${handoff_job}" "${context_job}" "${freeze_job}" "${non_foundational}"; then
            exit 0
          fi

          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/${RUN_SHA}/check-runs?per_page=100" > checks.json
          external_id="validation-context:${PR}:${RUN_SHA}:${digest}:${RUN_ID}"
          match_count="$(jq -r --arg eid "${external_id}" '[.check_runs[] | select(.name == "Validation context identity" and .conclusion == "success" and .external_id == $eid)] | length' checks.json)"
          [[ "${match_count}" -ge 1 ]] || { echo "::error::No context-bound identity for run ${RUN_ID}"; exit 2; }
          jq -r --arg eid "${external_id}" '[.check_runs[] | select(.name == "Validation context identity" and .conclusion == "success" and .external_id == $eid)] | sort_by(.completed_at // .started_at // "") | last | .output.summary' checks.json > context-summary.txt
          python3 process-oracle/scripts/validation-context.py check-match \
            --pr-json pr.json --target-sha "${RUN_SHA}" --summary context-summary.txt \
            --run-id "${RUN_ID}" --workflow "Arkus Candidate Validation" >/dev/null

          key="review-ready:${PR}:${RUN_SHA}:${digest}"
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" --paginate --jq '.[].body' | grep -Fq "Key: ${key}"; then
            exit 0
          fi
          detail="context-bound Worker handoff and exact-SHA validation source are green. Start a fresh independent Reviewer."
          body=$(cat <<EOF
          ARKUS_AUTOMATION_V2
          State: REVIEW_READY
          Key: ${key}
          Target SHA: ${RUN_SHA}
          Effective WP: ${wp}
          Process Only: ${process_only}
          Non Foundational: ${non_foundational}
          Validation Context Digest: ${digest}
          Validation Run ID: ${RUN_ID}
          Validation Workflow: Arkus Candidate Validation
          Detail: ${detail}
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="${body}" >/dev/null

          jq -n \
            --arg state "REVIEW_READY" --arg key "${key}" --arg wp "${wp}" \
            --arg detail "${detail}" --arg target_sha "${RUN_SHA}" \
            --arg context_digest "${digest}" --argjson pr "${PR}" \
            '{event_type:"arkus_notification",client_payload:{state:$state,key:$key,wp:$wp,detail:$detail,target_sha:$target_sha,context_digest:$context_digest,pr:$pr}}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input - >/dev/null

  review-transition:
    name: Process reviewer verdict
    if: >-
      (github.event_name == 'pull_request_review' &&
       (github.event.review.author_association == 'OWNER' ||
        github.event.review.author_association == 'MEMBER' ||
        github.event.review.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout process oracle
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: process-oracle
          fetch-depth: 1

      - name: Validate exact verdict and transition
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          REVIEW_BODY: ${{ github.event.review.body || github.event.comment.body }}
          REVIEW_AT: ${{ github.event.review.submitted_at || github.event.comment.created_at }}
        shell: bash
        run: |
          set -euo pipefail

          # CTX_DIRECT_PASS_GATE_BEGIN
          direct_candidate_validation_gate() {
            local run_conclusion="$1"
            local handoff_job="$2"
            local context_job="$3"
            local freeze_job="$4"
            local non_foundational="$5"
            [[ "${non_foundational}" == "true" || "${non_foundational}" == "false" ]] &&
              [[ "${run_conclusion}" == "success" ]] &&
              [[ "${handoff_job}" == "success" ]] &&
              [[ "${context_job}" == "success" ]] &&
              [[ "${freeze_job}" == "success" ]]
          }
          # CTX_DIRECT_PASS_GATE_END

          read -r verdict reviewed_sha < <(python3 - <<'PY'
          import os, re
          body = os.environ.get('REVIEW_BODY') or ''
          verdicts, shas = [], []
          for raw in body.splitlines():
              line = re.sub(r'^#{1,6}\s*', '', raw.strip()).replace('**','').replace('__','').replace('`','').strip()
              vm = re.fullmatch(r'Reviewer verdict:\s*(PASS|FAIL)\.?', line, re.I)
              sm = re.fullmatch(r'Reviewed candidate SHA:\s*([0-9a-fA-F]{40})\.?', line, re.I)
              if vm: verdicts.append(vm.group(1).upper())
              if sm: shas.append(sm.group(1).lower())
          print(verdicts[0], shas[0]) if len(verdicts) == len(shas) == 1 else print('NONE NONE')
          PY
          )
          [[ "${verdict}" != "NONE" ]] || exit 0
          [[ -n "${REVIEW_AT:-}" ]] || { echo "::error::Reviewer verdict timestamp unavailable"; exit 2; }

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" > pr.json
          frozen_sha="$(python3 - <<'PY'
          import json, re
          pr = json.load(open('pr.json', encoding='utf-8'))
          body = pr.get('body') or ''
          if pr.get('merged') or pr.get('draft'):
              raise SystemExit('PR must be open and Ready')
          def field(name):
              matches = re.findall(rf'^{re.escape(name)}:\s*`?([^`\r\n]+?)`?\s*$', body, re.M | re.I)
              if len(matches) != 1:
                  raise SystemExit(f'{name} must occur exactly once, found {len(matches)}')
              return matches[0].strip()
          for key, expected in {
              'Worker state':'FROZEN_FOR_REVIEW','Branch frozen':'YES',
              'Worker verdict':'IN_REVIEW','Worker pre-review':'CLEAN'
          }.items():
              if field(key).upper() != expected:
                  raise SystemExit(f'{key} mismatch')
          head = pr['head']['sha'].lower()
          frozen = field('Frozen candidate SHA').lower()
          if frozen != head:
              raise SystemExit('Frozen candidate SHA must equal PR HEAD')
          print(frozen)
          PY
          )"
          [[ "${reviewed_sha}" == "${frozen_sha}" ]] || { echo "::error::Reviewed SHA ${reviewed_sha} != frozen SHA ${frozen_sha}"; exit 2; }

          python3 process-oracle/scripts/validation-context.py self-test
          python3 process-oracle/scripts/validation-context.py resolve \
            --pr-json pr.json --target-sha "${reviewed_sha}" --record current-context.json >/dev/null
          wp="$(jq -r '.wp' current-context.json)"
          process_only="$(jq -r '.process_only' current-context.json)"
          non_foundational="$(jq -r '.non_foundational' current-context.json)"
          digest="$(jq -r '.context_digest' current-context.json)"

          if [[ "${verdict}" == "FAIL" ]]; then
            key="repair-required:${PR}:${reviewed_sha}:${digest}"
            if ! gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" --paginate --jq '.[].body' | grep -Fq "Key: ${key}"; then
              body=$(cat <<EOF
          ARKUS_AUTOMATION_V2
          State: REPAIR_REQUIRED
          Key: ${key}
          Target SHA: ${reviewed_sha}
          Validation Context Digest: ${digest}
          Detail: independent Reviewer FAIL. Start a fresh repair Worker on the same WP; do not advance downstream.
          EOF
              )
              gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="${body}" >/dev/null
            fi
            exit 0
          fi

          marker_key="review-ready:${PR}:${reviewed_sha}:${digest}"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" | jq '[.[][]]' > comments.json
          jq -c --arg key "${marker_key}" --arg before "${REVIEW_AT}" '
            [.[] | select(.user.login == "github-actions[bot]")
              | select(.created_at <= $before)
              | select((.body | split("\n") | index("ARKUS_AUTOMATION_V2")) != null)
              | select((.body | split("\n") | index("State: REVIEW_READY")) != null)
              | select((.body | split("\n") | index("Key: " + $key)) != null)]
            | sort_by(.created_at) | last // empty
          ' comments.json > marker.json
          [[ -s marker.json ]] || { echo "::error::No context-matching REVIEW_READY marker predating Reviewer verdict"; exit 2; }

          mapfile -t marker_fields < <(python3 - <<'PY'
          import json, re
          body = json.load(open('marker.json', encoding='utf-8')).get('body') or ''
          def field(name):
              matches = re.findall(rf'^{re.escape(name)}:\s*(.*?)\s*$', body, re.M)
              if len(matches) != 1:
                  raise SystemExit(f'marker {name} must occur exactly once, found {len(matches)}')
              return matches[0].strip()
          for name in ('Target SHA','Effective WP','Process Only','Non Foundational','Validation Context Digest','Validation Run ID','Validation Workflow'):
              print(field(name))
          PY
          )
          [[ "${marker_fields[0]}" == "${reviewed_sha}" ]] || { echo "::error::REVIEW_READY marker SHA mismatch"; exit 2; }
          [[ "${marker_fields[1]}" == "${wp}" ]] || { echo "::error::REVIEW_READY marker WP mismatch"; exit 2; }
          [[ "${marker_fields[2]}" == "${process_only}" ]] || { echo "::error::REVIEW_READY marker process class mismatch"; exit 2; }
          [[ "${marker_fields[3]}" == "${non_foundational}" ]] || { echo "::error::REVIEW_READY marker proof class mismatch"; exit 2; }
          [[ "${marker_fields[4]}" == "${digest}" ]] || { echo "::error::REVIEW_READY marker context digest mismatch"; exit 2; }
          validation_run_id="${marker_fields[5]}"
          validation_workflow="${marker_fields[6]}"
          [[ "${validation_run_id}" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid validation run id"; exit 2; }
          case "${validation_workflow}" in "Arkus Candidate Validation"|"Arkus Receipt Freeze Reuse") ;; *) exit 2;; esac

          gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/${reviewed_sha}/check-runs?per_page=100" > checks.json
          external_id="validation-context:${PR}:${reviewed_sha}:${digest}:${validation_run_id}"
          match_count="$(jq -r --arg eid "${external_id}" '[.check_runs[] | select(.name == "Validation context identity" and .conclusion == "success" and .external_id == $eid)] | length' checks.json)"
          [[ "${match_count}" -ge 1 ]] || { echo "::error::No context-bound identity matching REVIEW_READY source"; exit 2; }
          jq -r --arg eid "${external_id}" '[.check_runs[] | select(.name == "Validation context identity" and .conclusion == "success" and .external_id == $eid)] | sort_by(.completed_at // .started_at // "") | last | .output.summary' checks.json > context-summary.txt
          python3 process-oracle/scripts/validation-context.py check-match \
            --pr-json pr.json --target-sha "${reviewed_sha}" --summary context-summary.txt \
            --run-id "${validation_run_id}" --workflow "${validation_workflow}" >/dev/null

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${validation_run_id}" > validation-run.json
          run_conclusion="$(jq -r '.conclusion // empty' validation-run.json)"
          [[ "$(jq -r '.name // empty' validation-run.json)" == "${validation_workflow}" ]] || { echo "::error::Validation source workflow mismatch"; exit 2; }
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${validation_run_id}/jobs?per_page=100" > validation-jobs.json
          if [[ "${validation_workflow}" == "Arkus Candidate Validation" ]]; then
            [[ "$(jq -r '.head_sha // empty' validation-run.json)" == "${reviewed_sha}" ]] || { echo "::error::Validation source SHA mismatch"; exit 2; }
            [[ "$(jq -r --argjson pr "${PR}" '[.pull_requests[].number] | index($pr) != null' validation-run.json)" == "true" ]] || { echo "::error::Validation source PR mismatch"; exit 2; }
            handoff_job="$(jq -r '[.jobs[] | select(.name == "Worker handoff lint")] | last | .conclusion // "missing"' validation-jobs.json)"
            context_job="$(jq -r '[.jobs[] | select(.name == "Validation context binding")] | last | .conclusion // "missing"' validation-jobs.json)"
            freeze_job="$(jq -r '[.jobs[] | select(.name == "Freeze exact-SHA validation")] | last | .conclusion // "missing"' validation-jobs.json)"
            if ! direct_candidate_validation_gate "${run_conclusion}" "${handoff_job}" "${context_job}" "${freeze_job}" "${non_foundational}"; then
              echo "::error::Candidate Validation source is not fully GREEN"
              exit 2
            fi
          else
            [[ "${run_conclusion}" == "success" ]] || { echo "::error::Receipt reuse run is not successful"; exit 2; }
            reuse_job="$(jq -r '[.jobs[] | select(.name == "Reuse exact-SHA receipt for freeze")] | last | .conclusion // "missing"' validation-jobs.json)"
            [[ "${reuse_job}" == "success" ]] || { echo "::error::Receipt reuse job is not GREEN"; exit 2; }
          fi

          candidate_root="${RUNNER_TEMP}/pass-preflight-candidate"
          rm -rf "${candidate_root}"
          mkdir -p "${candidate_root}"
          git -C process-oracle fetch --no-tags --depth=1 origin "${reviewed_sha}"
          [[ "$(git -C process-oracle rev-parse FETCH_HEAD)" == "${reviewed_sha}" ]] || { echo "::error::Could not fetch exact reviewed candidate"; exit 2; }
          git -C process-oracle archive "${reviewed_sha}" | tar -x -C "${candidate_root}"

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" > pr-final.json
          python3 process-oracle/scripts/validation-context.py record-match \
            --pr-json pr-final.json --target-sha "${reviewed_sha}" --record current-context.json >/dev/null
          [[ "$(jq -r '.draft' pr-final.json)" == "false" ]] || { echo "::error::PR became Draft during PASS preflight"; exit 2; }
          python3 process-oracle/scripts/pass-preflight-handoff.py --self-test
          python3 process-oracle/scripts/pass-preflight-handoff.py \
            --pr-json pr-final.json --target-sha "${reviewed_sha}" --repo-root "${candidate_root}"

          # Re-read once more after the live oracle so a handoff-only edit that
          # races the first final read cannot inherit historical GREEN.
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" > pr-merge.json
          python3 process-oracle/scripts/validation-context.py record-match \
            --pr-json pr-merge.json --target-sha "${reviewed_sha}" --record current-context.json >/dev/null
          [[ "$(jq -r '.draft' pr-merge.json)" == "false" ]] || { echo "::error::PR became Draft immediately before merge"; exit 2; }
          python3 process-oracle/scripts/pass-preflight-handoff.py \
            --pr-json pr-merge.json --target-sha "${reviewed_sha}" --repo-root "${candidate_root}"

          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR}/merge" \
            -f sha="${reviewed_sha}" -f merge_method=merge > merge.json
          [[ "$(jq -r '.merged // false' merge.json)" == "true" ]] || { echo "::error::Exact-SHA merge was rejected"; cat merge.json; exit 2; }

          key="pass-merge:${PR}:${reviewed_sha}:${digest}"
          if ! gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" --paginate --jq '.[].body' | grep -Fq "Key: ${key}"; then
            body=$(cat <<EOF
          ARKUS_AUTOMATION_V2
          State: PASS_PREFLIGHT_GREEN
          Key: ${key}
          Target SHA: ${reviewed_sha}
          Validation Context Digest: ${digest}
          Validation Run ID: ${validation_run_id}
          Detail: Reviewer PASS, REVIEW_READY, current validation context, and the live canonical Worker handoff oracle all agree on the exact reviewed candidate. Exact-SHA merge completed.
          EOF
            )
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="${body}" >/dev/null
          fi

  docsync-marker:
    name: Mark DocSync required
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - name: Persist post-merge marker
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        shell: bash
        run: |
          set -euo pipefail
          process_only=false
          if printf '%s\n' "${PR_BODY}" | grep -Eqi '^(Mode|WORKFLOW_MODE):[[:space:]]*`?PROCESS_ONLY`?[[:space:]]*$'; then process_only=true; fi
          has_worker_lifecycle=false
          if printf '%s\n' "${PR_BODY}" | grep -Eqi '^(WP|Contract|Worker state|Candidate HEAD SHA|Worker pre-review|Frozen candidate SHA|Branch frozen):'; then has_worker_lifecycle=true; fi
          if [[ "${process_only}" == "true" && "${has_worker_lifecycle}" != "true" ]]; then exit 0; fi
          key="docsync-required:${PR}:${MERGE_SHA}"
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" --paginate --jq '.[].body' | grep -Fq "Key: ${key}"; then exit 0; fi
          body=$(cat <<EOF
          ARKUS_AUTOMATION_V2
          State: DOCSYNC_REQUIRED
          Key: ${key}
          Target SHA: ${MERGE_SHA}
          Detail: implementation merged. Run DocSync before selecting the next WP.
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="${body}" >/dev/null
