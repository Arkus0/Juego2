name: Arkus Receipt Freeze Reuse

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  checks: write
  contents: write
  issues: write
  pull-requests: read

jobs:
  reuse-freeze:
    name: Reuse exact-SHA receipt for freeze
    if: >-
      github.event.issue.pull_request != null &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      contains(github.event.comment.body, 'Action: RECHECK_REVIEW_READY')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.issue.number }}
    steps:
      - name: Checkout process oracle
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: process-oracle
          fetch-depth: 1

      - name: Validate frozen metadata, context and exact-SHA GREEN receipt
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" > pr.json
          sha="$(jq -r '.head.sha // empty' pr.json | tr '[:upper:]' '[:lower:]')"
          [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::PR HEAD is not an exact SHA"; exit 2; }
          [[ "$(jq -r '.draft' pr.json)" == "false" ]] || { echo "::error::PR is still Draft"; exit 2; }

          python3 process-oracle/scripts/validation-context.py self-test
          python3 process-oracle/scripts/validation-context.py resolve \
            --pr-json pr.json \
            --target-sha "${sha}" \
            --record VALIDATION_CONTEXT.json >/dev/null
          wp="$(jq -r '.wp' VALIDATION_CONTEXT.json)"
          process_only="$(jq -r '.process_only' VALIDATION_CONTEXT.json)"
          digest="$(jq -r '.context_digest' VALIDATION_CONTEXT.json)"

          [[ "${process_only}" == "false" ]] || { echo "::error::HK-00 receipt reuse is not valid for PROCESS_ONLY"; exit 2; }
          [[ "${wp}" == "WP-HK-00" ]] || {
            echo "::error::HK-00 receipt cannot satisfy requested workpack ${wp}"
            exit 2
          }

          python3 - <<'PY'
          import json, re
          pr = json.load(open('pr.json', encoding='utf-8'))
          body = pr.get('body') or ''
          def field(name):
              matches = re.findall(rf'^{re.escape(name)}:\s*`?([^`\r\n]+?)`?\s*$', body, re.M | re.I)
              if len(matches) != 1:
                  raise SystemExit(f'{name} must occur exactly once, found {len(matches)}')
              return matches[0].strip()
          expected = {
              'Worker state': 'FROZEN_FOR_REVIEW',
              'Branch frozen': 'YES',
              'Worker verdict': 'IN_REVIEW',
              'Worker pre-review': 'CLEAN',
              'Reviewer verdict': 'PENDING',
          }
          for key, value in expected.items():
              got = field(key)
              if got.upper() != value:
                  raise SystemExit(f'{key} must be {value}, got {got!r}')
          head = pr['head']['sha'].lower()
          frozen = field('Frozen candidate SHA').lower()
          candidate = field('Candidate HEAD SHA').lower()
          if not re.fullmatch(r'[0-9a-f]{40}', frozen):
              raise SystemExit('Frozen candidate SHA is missing/invalid')
          if frozen != head or candidate != head:
              raise SystemExit(f'Frozen/Candidate SHA must equal PR HEAD {head}')
          PY

          artifact_name="hk00-receipt-${sha}"
          artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100")"
          artifact_id="$(jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty' <<<"${artifact_json}")"
          source_run_id="$(jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty' <<<"${artifact_json}")"
          [[ -n "${artifact_id}" && -n "${source_run_id}" ]] || { echo "::error::No reusable receipt artifact for ${sha}"; exit 2; }

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}")"
          [[ "$(jq -r '.conclusion // empty' <<<"${run_json}")" == "success" ]] || { echo "::error::Source run is not successful"; exit 2; }
          [[ "$(jq -r '.head_sha // empty' <<<"${run_json}")" == "${sha}" ]] || { echo "::error::Source run SHA does not match frozen SHA"; exit 2; }

          tmp="${RUNNER_TEMP}/receipt-reuse"
          mkdir -p "${tmp}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${tmp}/receipt.zip"
          unzip -p "${tmp}/receipt.zip" EXECUTION_RECEIPT.txt > "${tmp}/EXECUTION_RECEIPT.txt"
          receipt="${tmp}/EXECUTION_RECEIPT.txt"

          python3 process-oracle/scripts/validation-context.py receipt-match \
            --receipt "${receipt}" \
            --requested-wp "${wp}" \
            --target-sha "${sha}"
          grep -Fxq 'EXECUTION_RECEIPT_V1' "${receipt}"
          grep -Fxq 'Candidate clean before: YES' "${receipt}"
          grep -Fxq 'Candidate clean after: YES' "${receipt}"
          grep -Eq '^Required gates: .*foundational-proof=success; .*causal-negative-controls=success; .*evidence-reconciliation=GREEN$' "${receipt}"
          grep -Fxq 'Result: GREEN' "${receipt}"

          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "wp=${wp}" >> "${GITHUB_OUTPUT}"
          echo "process_only=${process_only}" >> "${GITHUB_OUTPUT}"
          echo "context_digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "source_run_id=${source_run_id}" >> "${GITHUB_OUTPUT}"
          echo "artifact_id=${artifact_id}" >> "${GITHUB_OUTPUT}"

      - name: Persist successful freeze check on frozen SHA
        env:
          SHA: ${{ steps.validate.outputs.sha }}
          SOURCE_RUN_ID: ${{ steps.validate.outputs.source_run_id }}
          ARTIFACT_ID: ${{ steps.validate.outputs.artifact_id }}
          CONTEXT_DIGEST: ${{ steps.validate.outputs.context_digest }}
        shell: bash
        run: |
          set -euo pipefail
          summary="Validated and reused durable exact-SHA GREEN receipt from workflow run ${SOURCE_RUN_ID}, artifact ${ARTIFACT_ID}, under validation context ${CONTEXT_DIGEST}."
          jq -n \
            --arg name "Freeze exact-SHA validation" \
            --arg head_sha "${SHA}" \
            --arg external_id "receipt-freeze:${PR}:${SHA}:${CONTEXT_DIGEST}:${GITHUB_RUN_ID}" \
            --arg title "Exact-SHA GREEN receipt reused" \
            --arg summary "${summary}" \
            '{name:$name,head_sha:$head_sha,external_id:$external_id,status:"completed",conclusion:"success",output:{title:$title,summary:$summary}}' \
            | gh api --method POST -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/check-runs" --input - >/dev/null

      - name: Persist validation context identity
        env:
          SHA: ${{ steps.validate.outputs.sha }}
          CONTEXT_DIGEST: ${{ steps.validate.outputs.context_digest }}
        shell: bash
        run: |
          set -euo pipefail
          summary="$(python3 process-oracle/scripts/validation-context.py check-summary \
            --record VALIDATION_CONTEXT.json \
            --run-id "${GITHUB_RUN_ID}" \
            --workflow "Arkus Receipt Freeze Reuse")"
          external_id="validation-context:${PR}:${SHA}:${CONTEXT_DIGEST}:${GITHUB_RUN_ID}"
          jq -n \
            --arg name "Validation context identity" \
            --arg head_sha "${SHA}" \
            --arg external_id "${external_id}" \
            --arg title "Context-bound receipt reuse GREEN" \
            --arg summary "${summary}" \
            '{name:$name,head_sha:$head_sha,external_id:$external_id,status:"completed",conclusion:"success",output:{title:$title,summary:$summary}}' \
            | gh api --method POST -H 'Accept: application/vnd.github+json' \
                "repos/${GITHUB_REPOSITORY}/check-runs" --input - >/dev/null

      - name: Persist REVIEW_READY marker
        env:
          SHA: ${{ steps.validate.outputs.sha }}
          WP: ${{ steps.validate.outputs.wp }}
          PROCESS_ONLY: ${{ steps.validate.outputs.process_only }}
          CONTEXT_DIGEST: ${{ steps.validate.outputs.context_digest }}
          SOURCE_RUN_ID: ${{ steps.validate.outputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          key="review-ready:${PR}:${SHA}:${CONTEXT_DIGEST}"
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" --paginate --jq '.[].body' | grep -Fq "Key: ${key}"; then
            exit 0
          fi
          detail="frozen metadata and durable HK-00 exact-SHA receipt are verified under the current validation context (receipt source run ${SOURCE_RUN_ID}). Start a fresh independent Reviewer."
          body=$(cat <<EOF
          ARKUS_AUTOMATION_V2
          State: REVIEW_READY
          Key: ${key}
          Target SHA: ${SHA}
          Effective WP: ${WP}
          Process Only: ${PROCESS_ONLY}
          Validation Context Digest: ${CONTEXT_DIGEST}
          Validation Run ID: ${GITHUB_RUN_ID}
          Validation Workflow: Arkus Receipt Freeze Reuse
          Receipt Source Run ID: ${SOURCE_RUN_ID}
          Detail: ${detail}
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="${body}" >/dev/null

          jq -n \
            --arg state "REVIEW_READY" \
            --arg key "${key}" \
            --arg wp "${WP}" \
            --arg detail "${detail}" \
            --arg target_sha "${SHA}" \
            --arg context_digest "${CONTEXT_DIGEST}" \
            --argjson pr "${PR}" \
            '{event_type:"arkus_notification",client_payload:{state:$state,key:$key,wp:$wp,detail:$detail,target_sha:$target_sha,context_digest:$context_digest,pr:$pr}}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input - >/dev/null
