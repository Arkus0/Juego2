name: Arkus Candidate Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Canonical pull request number owning this candidate
        required: true
        type: string
      candidate_sha:
        description: Exact 40-character candidate SHA; must equal the PR HEAD
        required: true
        type: string
      mode:
        description: observation for mutable Worker state; verify for frozen candidate
        required: true
        default: observation
        type: choice
        options:
          - observation
          - verify

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: read

concurrency:
  group: arkus-candidate-${{ github.event.pull_request.number || inputs.pr_number || inputs.candidate_sha || github.ref }}
  cancel-in-progress: true

jobs:
  handoff-lint:
    name: Worker handoff lint
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BODY: ${{ github.event.pull_request.body || '' }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify linter self-tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-worker-handoff.py --self-test

      - name: Validate canonical Worker handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-worker-handoff.py --head-sha "${TARGET_SHA}"

  context-identity:
    name: Validation context binding
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'verify')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Resolve and persist exact validation context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation-context.py self-test
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            jq '.pull_request' "${GITHUB_EVENT_PATH}" > "${RUNNER_TEMP}/validation-pr.json"
          else
            [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]] || { echo "::error::pr_number must be a positive integer"; exit 2; }
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${RUNNER_TEMP}/validation-pr.json"
          fi
          python3 scripts/validation-context.py resolve \
            --pr-json "${RUNNER_TEMP}/validation-pr.json" \
            --target-sha "${TARGET_SHA}" \
            --github-output "${GITHUB_OUTPUT}" \
            --record VALIDATION_CONTEXT.json

      - name: Persist validation context identity check
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT_DIGEST: ${{ steps.context.outputs.context_digest }}
        shell: bash
        run: |
          set -euo pipefail
          summary="$(python3 scripts/validation-context.py check-summary \
            --record VALIDATION_CONTEXT.json \
            --run-id "${GITHUB_RUN_ID}" \
            --workflow "Arkus Candidate Validation")"
          external_id="validation-context:${PR_NUMBER}:${TARGET_SHA}:${CONTEXT_DIGEST}:${GITHUB_RUN_ID}"
          jq -n \
            --arg name "Validation context identity" \
            --arg head_sha "${TARGET_SHA}" \
            --arg external_id "${external_id}" \
            --arg title "Validation context bound" \
            --arg summary "${summary}" \
            '{name:$name,head_sha:$head_sha,external_id:$external_id,status:"completed",conclusion:"success",output:{title:$title,summary:$summary}}' \
            | gh api --method POST -H 'Accept: application/vnd.github+json' \
                "repos/${GITHUB_REPOSITORY}/check-runs" --input - >/dev/null

      - name: Upload context identity evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-context-${{ env.PR_NUMBER }}-${{ env.TARGET_SHA }}
          path: VALIDATION_CONTEXT.json
          if-no-files-found: error
          retention-days: 30

  observation:
    name: Candidate observation
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == true) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'observation')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
      ARKUS_EXECUTION_SUBSTRATE: github-actions-ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "${TARGET_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::TARGET_SHA is not exact"; exit 2; }
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Resolve effective validation context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation-context.py self-test
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            jq '.pull_request' "${GITHUB_EVENT_PATH}" > "${RUNNER_TEMP}/validation-pr.json"
          else
            [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]] || { echo "::error::pr_number must be a positive integer"; exit 2; }
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${RUNNER_TEMP}/validation-pr.json"
          fi
          python3 scripts/validation-context.py resolve \
            --pr-json "${RUNNER_TEMP}/validation-pr.json" \
            --target-sha "${TARGET_SHA}" \
            --github-output "${GITHUB_OUTPUT}" \
            --record VALIDATION_CONTEXT.json

      - name: Install pinned .NET SDK from global.json
        if: ${{ steps.context.outputs.process_only != 'true' && hashFiles('global.json') != '' }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      - name: Run canonical observation
        env:
          ARKUS_WP: ${{ steps.context.outputs.wp }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.context.outputs.process_only }}" == "true" ]]; then
            rm -f EXECUTION_RECEIPT.txt
            cat > validation.log <<EOF
          PROCESS_ONLY_VALIDATION_V1
          Candidate SHA: ${TARGET_SHA}
          Product/runtime validation: NOT_APPLICABLE
          Canonical execution command: NOT_RUN
          Execution receipt emitted: NO
          Applicable mechanical gate at Ready: Worker handoff lint
          Result: NOT_APPLICABLE
          Detail: PROCESS_ONLY declares no product/runtime execution proof; do not synthesize EXECUTION_RECEIPT_V1 or GREEN execution claims.
          EOF
            cat validation.log
            exit 0
          fi

          if [[ -f scripts/arkus-observe-exact-sha.sh ]]; then
            cmd=scripts/arkus-observe-exact-sha.sh
          elif [[ -f scripts/hk00-observe-exact-sha.sh ]]; then
            cmd=scripts/hk00-observe-exact-sha.sh
          else
            echo "::error::No canonical observation entrypoint. Add scripts/arkus-observe-exact-sha.sh (or the HK00 compatibility entrypoint)." | tee validation.log
            exit 2
          fi

          set +e
          bash "${cmd}" "${TARGET_SHA}" 2>&1 | tee validation.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -q '^EXECUTION_RECEIPT_V1$' validation.log; then
            awk '/^EXECUTION_RECEIPT_V1$/{emit=1} emit' validation.log > EXECUTION_RECEIPT.txt
          fi
          exit "${status}"

      - name: Upload observation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-observation-${{ env.TARGET_SHA }}
          path: |
            VALIDATION_CONTEXT.json
            validation.log
            EXECUTION_RECEIPT.txt
            artifacts/observed
          if-no-files-found: warn
          retention-days: 7

  verify:
    name: Freeze exact-SHA validation
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'verify')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
      ARKUS_EXECUTOR_ROLE: WORKER
      ARKUS_EXECUTION_SUBSTRATE: github-actions-ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "${TARGET_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::TARGET_SHA is not exact"; exit 2; }
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Resolve effective validation context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation-context.py self-test
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            jq '.pull_request' "${GITHUB_EVENT_PATH}" > "${RUNNER_TEMP}/validation-pr.json"
          else
            [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]] || { echo "::error::pr_number must be a positive integer"; exit 2; }
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${RUNNER_TEMP}/validation-pr.json"
          fi
          python3 scripts/validation-context.py resolve \
            --pr-json "${RUNNER_TEMP}/validation-pr.json" \
            --target-sha "${TARGET_SHA}" \
            --github-output "${GITHUB_OUTPUT}" \
            --record VALIDATION_CONTEXT.json

      - name: Reuse prior exact-SHA GREEN validation when safe
        id: reuse
        if: >-
          steps.context.outputs.process_only != 'true' &&
          ((github.event_name == 'pull_request' && github.event.action == 'edited') ||
           steps.context.outputs.wp == 'WP-HK-00')
        env:
          GH_TOKEN: ${{ github.token }}
          ARKUS_WP: ${{ steps.context.outputs.wp }}
          EDITED_METADATA_EVENT: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "reused=false" >> "${GITHUB_OUTPUT}"

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          # A PR-body edit is closure metadata, not a product mutation. Reuse an
          # immutable exact-SHA verify result when the source verify job itself
          # was GREEN and its recorded validation context still matches. The
          # source workflow may have failed overall because its old handoff
          # metadata was RED; the current handoff-lint job revalidates that
          # mutable metadata separately.
          if [[ "${EDITED_METADATA_EVENT}" == "true" ]]; then
            artifact_name="freeze-validation-${TARGET_SHA}"
            artifact_json="$(curl -fsSL "${headers[@]}" "${api}/actions/artifacts?name=${artifact_name}&per_page=100")"
            tmp="${RUNNER_TEMP}/arkus-reused-validation"
            rm -rf "${tmp}"
            mkdir -p "${tmp}"

            while IFS=$'\t' read -r artifact_id source_run_id; do
              [[ -n "${artifact_id}" && -n "${source_run_id}" ]] || continue
              [[ "${source_run_id}" != "${GITHUB_RUN_ID}" ]] || continue

              if ! run_json="$(curl -fsSL "${headers[@]}" "${api}/actions/runs/${source_run_id}")"; then
                continue
              fi
              [[ "$(jq -r '.name // empty' <<<"${run_json}")" == "Arkus Candidate Validation" ]] || continue
              [[ "$(jq -r '.head_sha // empty' <<<"${run_json}")" == "${TARGET_SHA}" ]] || continue

              if ! jobs_json="$(curl -fsSL "${headers[@]}" "${api}/actions/runs/${source_run_id}/jobs?per_page=100")"; then
                continue
              fi
              source_verify="$(jq -r '[.jobs[] | select(.name == "Freeze exact-SHA validation")] | last | .conclusion // "missing"' <<<"${jobs_json}")"
              source_context="$(jq -r '[.jobs[] | select(.name == "Validation context binding")] | last | .conclusion // "missing"' <<<"${jobs_json}")"
              [[ "${source_verify}" == "success" && "${source_context}" == "success" ]] || continue

              candidate_tmp="${tmp}/${artifact_id}"
              mkdir -p "${candidate_tmp}"
              if ! curl -fsSL -L "${headers[@]}" "${api}/actions/artifacts/${artifact_id}/zip" -o "${candidate_tmp}/artifact.zip"; then
                continue
              fi
              if ! unzip -p "${candidate_tmp}/artifact.zip" VALIDATION_CONTEXT.json > "${candidate_tmp}/VALIDATION_CONTEXT.json" 2>/dev/null; then
                continue
              fi
              if ! python3 scripts/validation-context.py record-match \
                --pr-json "${RUNNER_TEMP}/validation-pr.json" \
                --target-sha "${TARGET_SHA}" \
                --record "${candidate_tmp}/VALIDATION_CONTEXT.json" >/dev/null; then
                continue
              fi
              if ! unzip -p "${candidate_tmp}/artifact.zip" validation.log > "${candidate_tmp}/validation.log" 2>/dev/null; then
                continue
              fi

              rm -f EXECUTION_RECEIPT.txt
              if unzip -Z1 "${candidate_tmp}/artifact.zip" | grep -Fxq 'EXECUTION_RECEIPT.txt'; then
                unzip -p "${candidate_tmp}/artifact.zip" EXECUTION_RECEIPT.txt > EXECUTION_RECEIPT.txt
                python3 scripts/validation-context.py receipt-match \
                  --receipt EXECUTION_RECEIPT.txt \
                  --requested-wp "${ARKUS_WP}" \
                  --target-sha "${TARGET_SHA}"
              fi

              {
                echo "Reused prior exact-SHA GREEN validation after non-material PR metadata edit."
                echo "Requested WP: ${ARKUS_WP}"
                echo "Candidate/Product SHA: ${TARGET_SHA}"
                echo "Source workflow run: ${source_run_id}"
                echo "Source artifact: ${artifact_name} (${artifact_id})"
                echo "Source verify job: success"
                echo "Source validation context: exact match"
                echo
                cat "${candidate_tmp}/validation.log"
              } > validation.log
              cat > REUSED_RECEIPT_SOURCE.txt <<EOF
          Reuse class: NON_MATERIAL_PR_METADATA_EDIT
          Requested WP: ${ARKUS_WP}
          Candidate/Product SHA: ${TARGET_SHA}
          Source workflow run: ${source_run_id}
          Source artifact: ${artifact_name}
          Source artifact ID: ${artifact_id}
          Source verify job: success
          Validation context: exact match
          EOF
              echo "reused=true" >> "${GITHUB_OUTPUT}"
              echo "source_run_id=${source_run_id}" >> "${GITHUB_OUTPUT}"
              echo "reuse_class=non_material_pr_metadata_edit" >> "${GITHUB_OUTPUT}"
              exit 0
            done < <(jq -r '.artifacts[] | select(.expired == false) | [.id, .workflow_run.id] | @tsv' <<<"${artifact_json}")
          fi

          # Preserve the older HK-00 receipt reuse path for its original use
          # case. Other WPs fall through to a fresh verifier when no safe
          # same-SHA source exists.
          [[ "${ARKUS_WP}" == "WP-HK-00" ]] || exit 0
          [[ -f scripts/hk00-verify-exact-sha.sh ]] || exit 0

          artifact_name="hk00-receipt-${TARGET_SHA}"
          artifact_json="$(curl -fsSL "${headers[@]}" "${api}/actions/artifacts?name=${artifact_name}&per_page=100")"
          artifact_id="$(jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty' <<<"${artifact_json}")"
          source_run_id="$(jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty' <<<"${artifact_json}")"
          [[ -n "${artifact_id}" && -n "${source_run_id}" ]] || exit 0

          run_json="$(curl -fsSL "${headers[@]}" "${api}/actions/runs/${source_run_id}")"
          [[ "$(jq -r '.conclusion // empty' <<<"${run_json}")" == "success" ]] || { echo "::error::Receipt artifact source run ${source_run_id} is not successful"; exit 2; }
          [[ "$(jq -r '.head_sha // empty' <<<"${run_json}")" == "${TARGET_SHA}" ]] || { echo "::error::Receipt artifact source run is not bound to ${TARGET_SHA}"; exit 2; }

          tmp="${RUNNER_TEMP}/arkus-reused-receipt"
          rm -rf "${tmp}"
          mkdir -p "${tmp}"
          curl -fsSL -L "${headers[@]}" "${api}/actions/artifacts/${artifact_id}/zip" -o "${tmp}/receipt.zip"
          unzip -p "${tmp}/receipt.zip" EXECUTION_RECEIPT.txt > "${tmp}/EXECUTION_RECEIPT.txt"
          receipt="${tmp}/EXECUTION_RECEIPT.txt"
          python3 scripts/validation-context.py receipt-match \
            --receipt "${receipt}" \
            --requested-wp "${ARKUS_WP}" \
            --target-sha "${TARGET_SHA}"
          grep -Fxq 'EXECUTION_RECEIPT_V1' "${receipt}"
          grep -Fxq 'Candidate clean before: YES' "${receipt}"
          grep -Fxq 'Candidate clean after: YES' "${receipt}"
          grep -Eq '^Required gates: .*foundational-proof=success; .*causal-negative-controls=success; .*evidence-reconciliation=GREEN$' "${receipt}"
          grep -Fxq 'Result: GREEN' "${receipt}"

          cp "${receipt}" EXECUTION_RECEIPT.txt
          {
            echo "Reused prior exact-SHA GREEN receipt."
            echo "Requested WP: ${ARKUS_WP}"
            echo "Source workflow run: ${source_run_id}"
            echo "Source artifact: ${artifact_name} (${artifact_id})"
            cat EXECUTION_RECEIPT.txt
          } > validation.log
          cat > REUSED_RECEIPT_SOURCE.txt <<EOF
          Requested WP: ${ARKUS_WP}
          Candidate SHA: ${TARGET_SHA}
          Source workflow run: ${source_run_id}
          Source artifact: ${artifact_name}
          Source artifact ID: ${artifact_id}
          EOF
          echo "reused=true" >> "${GITHUB_OUTPUT}"
          echo "source_run_id=${source_run_id}" >> "${GITHUB_OUTPUT}"

      - name: Install pinned .NET SDK from global.json
        if: ${{ steps.context.outputs.process_only != 'true' && steps.reuse.outputs.reused != 'true' && hashFiles('global.json') != '' }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      - name: Run canonical frozen-candidate verifier
        if: ${{ steps.reuse.outputs.reused != 'true' }}
        env:
          ARKUS_WP: ${{ steps.context.outputs.wp }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.context.outputs.process_only }}" == "true" ]]; then
            rm -f EXECUTION_RECEIPT.txt REUSED_RECEIPT_SOURCE.txt
            cat > validation.log <<EOF
          PROCESS_ONLY_VALIDATION_V1
          Candidate SHA: ${TARGET_SHA}
          Product/runtime validation: NOT_APPLICABLE
          Canonical execution command: NOT_RUN
          Execution receipt emitted: NO
          Applicable mechanical gate: Worker handoff lint
          Result: NOT_APPLICABLE
          Detail: PROCESS_ONLY declares no product/runtime execution proof; do not synthesize EXECUTION_RECEIPT_V1 or GREEN execution claims.
          EOF
            cat validation.log
            exit 0
          fi

          if [[ -f scripts/arkus-verify-exact-sha.sh ]]; then
            cmd=scripts/arkus-verify-exact-sha.sh
          elif [[ -f scripts/hk00-verify-exact-sha.sh ]]; then
            cmd=scripts/hk00-verify-exact-sha.sh
          else
            echo "::error::No canonical verify entrypoint. Add scripts/arkus-verify-exact-sha.sh (or the HK00 compatibility entrypoint)." | tee validation.log
            exit 2
          fi

          set +e
          bash "${cmd}" "${TARGET_SHA}" 2>&1 | tee validation.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -q '^EXECUTION_RECEIPT_V1$' validation.log; then
            awk '/^EXECUTION_RECEIPT_V1$/{emit=1} emit' validation.log > EXECUTION_RECEIPT.txt
          fi
          exit "${status}"

      - name: Upload frozen-candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freeze-validation-${{ env.TARGET_SHA }}
          path: |
            VALIDATION_CONTEXT.json
            validation.log
            EXECUTION_RECEIPT.txt
            REUSED_RECEIPT_SOURCE.txt
            artifacts/observed
          if-no-files-found: warn
          retention-days: 30