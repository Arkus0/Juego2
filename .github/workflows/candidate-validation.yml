name: Arkus Candidate Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character candidate SHA
        required: true
        type: string
      mode:
        description: observation for mutable Worker state; verify for frozen candidate
        required: true
        default: observation
        type: choice
        options:
          - observation
          - verify

permissions:
  contents: read
  actions: read

concurrency:
  group: arkus-candidate-${{ github.event.pull_request.number || inputs.candidate_sha || github.ref }}
  cancel-in-progress: true

jobs:
  observation:
    name: Candidate observation
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == true) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'observation')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
      PR_BODY: ${{ github.event.pull_request.body || '' }}
      ARKUS_EXECUTION_SUBSTRATE: github-actions-ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "${TARGET_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::TARGET_SHA is not exact"; exit 2; }
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Install pinned .NET SDK from global.json
        if: ${{ hashFiles('global.json') != '' }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      - name: Run canonical observation
        shell: bash
        run: |
          set -euo pipefail
          if printf '%s\n' "${PR_BODY}" | grep -Eqi '^(Mode|WORKFLOW_MODE):[[:space:]]*`?PROCESS_ONLY`?[[:space:]]*$'; then
            cat > EXECUTION_RECEIPT.txt <<EOF
          EXECUTION_RECEIPT_V1
          WP: PROCESS_ONLY
          Candidate SHA: ${TARGET_SHA}
          Executor role: WORKER
          Execution environment: github-actions-ubuntu-24.04
          Canonical command: process-only
          Candidate clean before: YES
          Candidate clean after: YES
          Required gates: process-only=GREEN
          Result: GREEN
          Evidence: NONE
          EOF
            cat EXECUTION_RECEIPT.txt | tee validation.log
            exit 0
          fi

          if [[ -f scripts/arkus-observe-exact-sha.sh ]]; then
            cmd=scripts/arkus-observe-exact-sha.sh
          elif [[ -f scripts/hk00-observe-exact-sha.sh ]]; then
            cmd=scripts/hk00-observe-exact-sha.sh
          else
            echo "::error::No canonical observation entrypoint. Add scripts/arkus-observe-exact-sha.sh (or the HK00 compatibility entrypoint)." | tee validation.log
            exit 2
          fi

          set +e
          bash "${cmd}" "${TARGET_SHA}" 2>&1 | tee validation.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -q '^EXECUTION_RECEIPT_V1$' validation.log; then
            awk '/^EXECUTION_RECEIPT_V1$/{emit=1} emit' validation.log > EXECUTION_RECEIPT.txt
          fi
          exit "${status}"

      - name: Upload observation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-observation-${{ env.TARGET_SHA }}
          path: |
            validation.log
            EXECUTION_RECEIPT.txt
            artifacts/observed
          if-no-files-found: warn
          retention-days: 7

  verify:
    name: Freeze exact-SHA validation
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'verify')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
      PR_BODY: ${{ github.event.pull_request.body || '' }}
      ARKUS_EXECUTOR_ROLE: WORKER
      ARKUS_EXECUTION_SUBSTRATE: github-actions-ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "${TARGET_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::TARGET_SHA is not exact"; exit 2; }
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Reuse prior exact-SHA GREEN receipt when available
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "reused=false" >> "${GITHUB_OUTPUT}"

          # HK00 compatibility fast-path. The receipt itself remains the semantic
          # authority; this workflow only validates and projects that durable fact.
          [[ -f scripts/hk00-verify-exact-sha.sh ]] || exit 0

          artifact_name="hk00-receipt-${TARGET_SHA}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          artifact_json="$(curl -fsSL "${headers[@]}" "${api}/actions/artifacts?name=${artifact_name}&per_page=100")"
          artifact_id="$(jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty' <<<"${artifact_json}")"
          source_run_id="$(jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty' <<<"${artifact_json}")"
          [[ -n "${artifact_id}" && -n "${source_run_id}" ]] || exit 0

          run_json="$(curl -fsSL "${headers[@]}" "${api}/actions/runs/${source_run_id}")"
          [[ "$(jq -r '.conclusion // empty' <<<"${run_json}")" == "success" ]] || {
            echo "::error::Receipt artifact source run ${source_run_id} is not successful"
            exit 2
          }
          [[ "$(jq -r '.head_sha // empty' <<<"${run_json}")" == "${TARGET_SHA}" ]] || {
            echo "::error::Receipt artifact source run is not bound to ${TARGET_SHA}"
            exit 2
          }

          tmp="${RUNNER_TEMP}/arkus-reused-receipt"
          rm -rf "${tmp}"
          mkdir -p "${tmp}"
          curl -fsSL -L "${headers[@]}" "${api}/actions/artifacts/${artifact_id}/zip" -o "${tmp}/receipt.zip"
          unzip -p "${tmp}/receipt.zip" EXECUTION_RECEIPT.txt > "${tmp}/EXECUTION_RECEIPT.txt"

          receipt="${tmp}/EXECUTION_RECEIPT.txt"
          grep -Fxq 'EXECUTION_RECEIPT_V1' "${receipt}"
          grep -Fxq "WP: WP-HK-00" "${receipt}"
          grep -Fxq "Candidate SHA: ${TARGET_SHA}" "${receipt}"
          grep -Fxq 'Candidate clean before: YES' "${receipt}"
          grep -Fxq 'Candidate clean after: YES' "${receipt}"
          grep -Eq '^Required gates: .*foundational-proof=success; .*causal-negative-controls=success; .*evidence-reconciliation=GREEN$' "${receipt}"
          grep -Fxq 'Result: GREEN' "${receipt}"

          cp "${receipt}" EXECUTION_RECEIPT.txt
          {
            echo "Reused prior exact-SHA GREEN receipt."
            echo "Source workflow run: ${source_run_id}"
            echo "Source artifact: ${artifact_name} (${artifact_id})"
            cat EXECUTION_RECEIPT.txt
          } > validation.log
          cat > REUSED_RECEIPT_SOURCE.txt <<EOF
          Candidate SHA: ${TARGET_SHA}
          Source workflow run: ${source_run_id}
          Source artifact: ${artifact_name}
          Source artifact ID: ${artifact_id}
          EOF
          cat validation.log
          echo "reused=true" >> "${GITHUB_OUTPUT}"
          echo "source_run_id=${source_run_id}" >> "${GITHUB_OUTPUT}"

      - name: Install pinned .NET SDK from global.json
        if: ${{ steps.reuse.outputs.reused != 'true' && hashFiles('global.json') != '' }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      - name: Run canonical frozen-candidate verifier
        if: ${{ steps.reuse.outputs.reused != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if printf '%s\n' "${PR_BODY}" | grep -Eqi '^(Mode|WORKFLOW_MODE):[[:space:]]*`?PROCESS_ONLY`?[[:space:]]*$'; then
            cat > EXECUTION_RECEIPT.txt <<EOF
          EXECUTION_RECEIPT_V1
          WP: PROCESS_ONLY
          Candidate SHA: ${TARGET_SHA}
          Executor role: WORKER
          Execution environment: github-actions-ubuntu-24.04
          Canonical command: process-only
          Candidate clean before: YES
          Candidate clean after: YES
          Required gates: process-only=GREEN
          Result: GREEN
          Evidence: NONE
          EOF
            cat EXECUTION_RECEIPT.txt | tee validation.log
            exit 0
          fi

          if [[ -f scripts/arkus-verify-exact-sha.sh ]]; then
            cmd=scripts/arkus-verify-exact-sha.sh
          elif [[ -f scripts/hk00-verify-exact-sha.sh ]]; then
            cmd=scripts/hk00-verify-exact-sha.sh
          else
            echo "::error::No canonical verify entrypoint. Add scripts/arkus-verify-exact-sha.sh (or the HK00 compatibility entrypoint)." | tee validation.log
            exit 2
          fi

          set +e
          bash "${cmd}" "${TARGET_SHA}" 2>&1 | tee validation.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -q '^EXECUTION_RECEIPT_V1$' validation.log; then
            awk '/^EXECUTION_RECEIPT_V1$/{emit=1} emit' validation.log > EXECUTION_RECEIPT.txt
          fi
          exit "${status}"

      - name: Upload frozen-candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freeze-validation-${{ env.TARGET_SHA }}
          path: |
            validation.log
            EXECUTION_RECEIPT.txt
            REUSED_RECEIPT_SOURCE.txt
            artifacts/observed
          if-no-files-found: warn
          retention-days: 30
