name: Arkus Candidate Validation

on:
  # Product verification is a freeze-time gate, not a background observer.
  # Draft coding pushes are covered by Arkus Main Safety. PR-body edits never
  # represent product mutations and therefore do not trigger this workflow.
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Canonical pull request number owning this candidate
        required: true
        type: string
      candidate_sha:
        description: Exact 40-character candidate SHA; must equal the PR HEAD
        required: true
        type: string
      mode:
        description: observation is explicit/on-demand; verify is freeze-time validation
        required: true
        default: verify
        type: choice
        options: [observation, verify]

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: read

concurrency:
  group: arkus-candidate-${{ github.event.pull_request.number || inputs.pr_number || inputs.candidate_sha || github.ref }}
  cancel-in-progress: true

jobs:
  handoff-lint:
    name: Worker handoff lint
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BODY: ${{ github.event.pull_request.body || '' }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Validate canonical Worker handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-worker-handoff.py --self-test
          python3 scripts/validate-worker-handoff.py --head-sha "${TARGET_SHA}"

  context-identity:
    name: Validation context binding
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'verify')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Resolve exact validation context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation-context.py self-test
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            jq '.pull_request' "${GITHUB_EVENT_PATH}" > "${RUNNER_TEMP}/validation-pr.json"
          else
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${RUNNER_TEMP}/validation-pr.json"
          fi
          python3 scripts/validation-context.py resolve \
            --pr-json "${RUNNER_TEMP}/validation-pr.json" \
            --target-sha "${TARGET_SHA}" \
            --github-output "${GITHUB_OUTPUT}" \
            --record VALIDATION_CONTEXT.json
      - name: Persist validation context identity check
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT_DIGEST: ${{ steps.context.outputs.context_digest }}
        shell: bash
        run: |
          set -euo pipefail
          summary="$(python3 scripts/validation-context.py check-summary --record VALIDATION_CONTEXT.json --run-id "${GITHUB_RUN_ID}" --workflow "Arkus Candidate Validation")"
          external_id="validation-context:${PR_NUMBER}:${TARGET_SHA}:${CONTEXT_DIGEST}:${GITHUB_RUN_ID}"
          jq -n --arg name "Validation context identity" --arg head_sha "${TARGET_SHA}" \
            --arg external_id "${external_id}" --arg summary "${summary}" \
            '{name:$name,head_sha:$head_sha,external_id:$external_id,status:"completed",conclusion:"success",output:{title:"Validation context bound",summary:$summary}}' \
            | gh api --method POST -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/check-runs" --input - >/dev/null
      - name: Upload context identity evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-context-${{ env.PR_NUMBER }}-${{ env.TARGET_SHA }}
          path: VALIDATION_CONTEXT.json
          if-no-files-found: error
          retention-days: 30

  observation:
    name: Candidate observation
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'observation'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ inputs.candidate_sha }}
      PR_NUMBER: ${{ inputs.pr_number }}
      ARKUS_EXECUTION_SUBSTRATE: github-actions-ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Resolve context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${RUNNER_TEMP}/validation-pr.json"
          python3 scripts/validation-context.py resolve --pr-json "${RUNNER_TEMP}/validation-pr.json" --target-sha "${TARGET_SHA}" --github-output "${GITHUB_OUTPUT}" --record VALIDATION_CONTEXT.json
      - name: Install pinned .NET SDK
        if: ${{ steps.context.outputs.process_only != 'true' && hashFiles('global.json') != '' }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - name: Run explicit observation
        env:
          ARKUS_WP: ${{ steps.context.outputs.wp }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.context.outputs.process_only }}" == "true" ]]; then
            echo 'PROCESS_ONLY: observation not applicable' | tee validation.log
            exit 0
          fi
          if [[ -f scripts/arkus-observe-exact-sha.sh ]]; then cmd=scripts/arkus-observe-exact-sha.sh; else cmd=scripts/hk00-observe-exact-sha.sh; fi
          bash "${cmd}" "${TARGET_SHA}" 2>&1 | tee validation.log
      - name: Upload observation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-observation-${{ env.TARGET_SHA }}
          path: |
            VALIDATION_CONTEXT.json
            validation.log
            artifacts/observed
          if-no-files-found: warn
          retention-days: 7

  verify:
    name: Freeze exact-SHA validation
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'verify')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      ARKUS_EXECUTOR_ROLE: WORKER
      ARKUS_EXECUTION_SUBSTRATE: github-actions-ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "${TARGET_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Resolve effective validation context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then jq '.pull_request' "${GITHUB_EVENT_PATH}" > "${RUNNER_TEMP}/validation-pr.json"; else gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${RUNNER_TEMP}/validation-pr.json"; fi
          python3 scripts/validation-context.py self-test
          python3 scripts/validation-context.py resolve --pr-json "${RUNNER_TEMP}/validation-pr.json" --target-sha "${TARGET_SHA}" --github-output "${GITHUB_OUTPUT}" --record VALIDATION_CONTEXT.json
      - name: Install pinned .NET SDK
        if: ${{ steps.context.outputs.process_only != 'true' && hashFiles('global.json') != '' }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - name: Run canonical frozen-candidate verifier
        env:
          ARKUS_WP: ${{ steps.context.outputs.wp }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.context.outputs.process_only }}" == "true" ]]; then
            cat > validation.log <<EOF
          PROCESS_ONLY_VALIDATION_V1
          Candidate SHA: ${TARGET_SHA}
          Product/runtime validation: NOT_APPLICABLE
          Result: NOT_APPLICABLE
          EOF
            exit 0
          fi
          if [[ -f scripts/arkus-verify-exact-sha.sh ]]; then cmd=scripts/arkus-verify-exact-sha.sh; elif [[ -f scripts/hk00-verify-exact-sha.sh ]]; then cmd=scripts/hk00-verify-exact-sha.sh; else echo '::error::No canonical exact-SHA verifier'; exit 2; fi
          set +e
          bash "${cmd}" "${TARGET_SHA}" 2>&1 | tee validation.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -q '^EXECUTION_RECEIPT_V1$' validation.log; then awk '/^EXECUTION_RECEIPT_V1$/{emit=1} emit' validation.log > EXECUTION_RECEIPT.txt; fi
          exit "${status}"
      - name: Upload frozen-candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freeze-validation-${{ env.TARGET_SHA }}
          path: |
            VALIDATION_CONTEXT.json
            validation.log
            EXECUTION_RECEIPT.txt
            artifacts/observed
          if-no-files-found: warn
          retention-days: 30
