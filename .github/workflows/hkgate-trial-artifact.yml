name: HK GATE Trial Artifact

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/hkgate-trial-artifact.yml'

permissions:
  contents: read

jobs:
  build-trial-artifact:
    name: Build frozen MCP trial artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: 0fa3d4fb039a3d0049cea0f3eed1c83128ec7dcd
      OUT_DIR: artifacts/hkgate-mcp-linux-x64
    steps:
      - name: Checkout frozen candidate exactly
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Install candidate-pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      - name: Restore candidate exactly
        shell: bash
        run: |
          set -euo pipefail
          dotnet --version | tee /tmp/dotnet-version.txt
          test "$(dotnet --version)" = "8.0.425"
          dotnet restore Juego2.sln --locked-mode -m:1 --disable-build-servers

      - name: Publish MCP host with locked candidate dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}/app" "${OUT_DIR}/dotnet-runtime"
          dotnet publish src/Arkus.Harness.Mcp/Arkus.Harness.Mcp.csproj \
            --configuration Release \
            --no-restore \
            --no-self-contained \
            -p:UseAppHost=false \
            -o "${OUT_DIR}/app"
          test -f "${OUT_DIR}/app/Arkus.Harness.Mcp.dll"
          find "${OUT_DIR}/app" -type f -name '*.pdb' -delete
          test -z "$(find "${OUT_DIR}/app" -type f -name '*.pdb' -print -quit)"

      - name: Bundle the .NET 8 runtime from the pinned SDK environment
        shell: bash
        run: |
          set -euo pipefail
          runtime_version="$(dotnet --list-runtimes | awk '$1 == "Microsoft.NETCore.App" && $2 ~ /^8\./ { print $2 }' | sort -V | tail -n1)"
          fxr_version="$(find "${DOTNET_ROOT}/host/fxr" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | grep '^8\.' | sort -V | tail -n1)"
          test -n "${runtime_version}"
          test -n "${fxr_version}"
          cp "${DOTNET_ROOT}/dotnet" "${OUT_DIR}/dotnet-runtime/dotnet"
          mkdir -p "${OUT_DIR}/dotnet-runtime/host/fxr" "${OUT_DIR}/dotnet-runtime/shared/Microsoft.NETCore.App"
          cp -a "${DOTNET_ROOT}/host/fxr/${fxr_version}" "${OUT_DIR}/dotnet-runtime/host/fxr/"
          cp -a "${DOTNET_ROOT}/shared/Microsoft.NETCore.App/${runtime_version}" "${OUT_DIR}/dotnet-runtime/shared/Microsoft.NETCore.App/"
          if [[ -d "${DOTNET_ROOT}/shared/Microsoft.AspNetCore.App/${runtime_version}" ]]; then
            mkdir -p "${OUT_DIR}/dotnet-runtime/shared/Microsoft.AspNetCore.App"
            cp -a "${DOTNET_ROOT}/shared/Microsoft.AspNetCore.App/${runtime_version}" "${OUT_DIR}/dotnet-runtime/shared/Microsoft.AspNetCore.App/"
          fi
          cat > "${OUT_DIR}/run-mcp.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export DOTNET_ROOT="${HERE}/dotnet-runtime"
          exec "${DOTNET_ROOT}/dotnet" "${HERE}/app/Arkus.Harness.Mcp.dll" "$@"
          EOF
          chmod +x "${OUT_DIR}/run-mcp.sh" "${OUT_DIR}/dotnet-runtime/dotnet"
          printf '%s\n' "${runtime_version}" > /tmp/runtime-version.txt
          printf '%s\n' "${fxr_version}" > /tmp/fxr-version.txt

      - name: Smoke-check bundled runtime without system dotnet
        shell: bash
        run: |
          set -euo pipefail
          env -i HOME="${HOME}" PATH="/usr/bin:/bin" bash -c '
            set -euo pipefail
            root="$1"
            test -x "${root}/run-mcp.sh"
            test -x "${root}/dotnet-runtime/dotnet"
            "${root}/dotnet-runtime/dotnet" --info >/tmp/bundled-dotnet-info.txt
          ' _ "${OUT_DIR}"
          grep -Fq "$(cat /tmp/runtime-version.txt)" /tmp/bundled-dotnet-info.txt

      - name: Bind artifact to candidate and checksum
        shell: bash
        run: |
          set -euo pipefail
          cat > "${OUT_DIR}/ARTIFACT_PROVENANCE.txt" <<EOF
          HK_GATE_TRIAL_ARTIFACT_V1
          Candidate SHA: ${TARGET_SHA}
          Build SDK: $(cat /tmp/dotnet-version.txt)
          Bundled Microsoft.NETCore.App: $(cat /tmp/runtime-version.txt)
          Bundled host/fxr: $(cat /tmp/fxr-version.txt)
          Runtime platform: linux-x64 GitHub Actions runner
          Candidate restore locked: YES
          Product package lock rewritten: NO
          Product source modified: NO
          Debug symbols in artifact: NO
          Launch entrypoint: ./run-mcp.sh
          Source workflow commit: ${GITHUB_SHA}
          Source workflow run: ${GITHUB_RUN_ID}
          Repository: ${GITHUB_REPOSITORY}
          EOF
          (
            cd "${OUT_DIR}"
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
          cat "${OUT_DIR}/ARTIFACT_PROVENANCE.txt"
          grep 'Arkus.Harness.Mcp.dll\|run-mcp.sh\|dotnet-runtime/dotnet' "${OUT_DIR}/SHA256SUMS.txt"

      - name: Upload runtime-bundled trial artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hkgate-mcp-linux-x64-0fa3d4fb039a3d0049cea0f3eed1c83128ec7dcd
          path: artifacts/hkgate-mcp-linux-x64
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
