name: DW-04 Model Campaign

on:
  pull_request:
    types: [edited]

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: read

concurrency:
  group: dw04-model-campaign-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  calibration:
    name: Frozen CTX-only calibration
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.body || '', 'DW04 campaign: CALIBRATION')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PRECALIBRATION_COMMIT: 9cbed950a3469897cf286c9a90624c240701528f
      ARKUS_EXECUTION_SUBSTRATE: github-actions-ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Validate exact campaign request
        shell: bash
        run: |
          set -euo pipefail
          [[ "${TARGET_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::TARGET_SHA is not exact"; exit 2; }
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"
          marker="DW04 campaign: CALIBRATION ${TARGET_SHA}"
          jq -e --arg marker "${marker}" '.pull_request.draft == true and .pull_request.head.repo.full_name == .repository.full_name and ((.pull_request.body // "") | contains($marker))' "${GITHUB_EVENT_PATH}" >/dev/null || {
            echo "::error::PR body must contain exact marker: ${marker}"
            exit 2
          }
          test "${PR_NUMBER}" = "150" || { echo "::error::DW-04 canonical PR is #150"; exit 2; }

      - name: Require configured provider credential before claiming campaign
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY}" || {
            echo "::error::OPENROUTER_API_KEY repository secret is not configured; no campaign receipt or provider call was created"
            exit 10
          }

      - name: Install pinned .NET SDK from global.json
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      - name: Re-prove canonical observation on campaign candidate
        env:
          ARKUS_WP: WP-DW-04
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/dw04-observe-exact-sha.sh "${TARGET_SHA}"

      - name: Claim unique durable calibration campaign
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs"
          existing="$(gh api -H 'Accept: application/vnd.github+json' "${api}" --jq '[.check_runs[] | select(.name == "DW-04 calibration campaign start")] | length')"
          test "${existing}" = "0" || {
            echo "::error::A durable calibration campaign start already exists for ${TARGET_SHA}; refusing a second campaign"
            exit 20
          }

          campaign_id="github-actions:${GITHUB_REPOSITORY}:pr${PR_NUMBER}:sha${TARGET_SHA}:run${GITHUB_RUN_ID}:calibration"
          echo "DW04_CAMPAIGN_ID=${campaign_id}" >> "${GITHUB_ENV}"
          mkdir -p artifacts/observed/dw04-calibration
          jq -n \
            --arg schema 'dw04-campaign-start-v1' \
            --arg campaign_id "${campaign_id}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg pr_number "${PR_NUMBER}" \
            --arg candidate_sha "${TARGET_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg model 'deepseek/deepseek-v4.1-flash' \
            --arg provider 'OpenRouter -> DeepInfra serving DeepSeek V4.1 Flash (fallback disabled)' \
            '{schema:$schema,campaign_id:$campaign_id,repository:$repository,pr_number:$pr_number,candidate_sha:$candidate_sha,github_run_id:$run_id,github_run_attempt:$run_attempt,phase:"CALIBRATION",state:"CLAIMED_BEFORE_PROVIDER_CALLS",model:$model,provider_route:$provider}' \
            > artifacts/observed/dw04-calibration/CAMPAIGN_START_RECEIPT.json

          summary="DW-04 CTX-only calibration campaign claimed before provider calls. PR #${PR_NUMBER}; exact candidate ${TARGET_SHA}; workflow run ${GITHUB_RUN_ID}; campaign ${campaign_id}; model deepseek/deepseek-v4.1-flash via pinned DeepInfra serving provider on OpenRouter. A second calibration campaign on this SHA must fail closed."
          jq -n \
            --arg name 'DW-04 calibration campaign start' \
            --arg head_sha "${TARGET_SHA}" \
            --arg external_id "${campaign_id}" \
            --arg title 'DW-04 calibration campaign claimed' \
            --arg summary "${summary}" \
            '{name:$name,head_sha:$head_sha,external_id:$external_id,status:"completed",conclusion:"neutral",output:{title:$title,summary:$summary}}' \
            | gh api --method POST -H 'Accept: application/vnd.github+json' \
                "repos/${GITHUB_REPOSITORY}/check-runs" --input - >/dev/null

      - name: Execute frozen eight-call CTX calibration
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DW04_PR_NUMBER: ${{ env.PR_NUMBER }}
          DW04_CANDIDATE_SHA: ${{ env.TARGET_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/dw04-calibrate.py \
            --pre-commit "${PRECALIBRATION_COMMIT}" \
            --protocol-commit "${TARGET_SHA}" \
            --output artifacts/observed/dw04-calibration/CALIBRATION_RESULTS.json

      - name: Persist READY check
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"readiness": "READY"' artifacts/observed/dw04-calibration/CALIBRATION_RESULTS.json
          summary="Eight frozen CTX-only DeepSeek V4.1 Flash calibration slots are complete and all passed the pre-frozen oracles. The retained C-CITY-01/R1 invalid attempt remains accounted before its single replacement. Exact candidate ${TARGET_SHA}; workflow run ${GITHUB_RUN_ID}; campaign ${DW04_CAMPAIGN_ID}."
          jq -n \
            --arg name 'DW-04 calibration result' \
            --arg head_sha "${TARGET_SHA}" \
            --arg external_id "${DW04_CAMPAIGN_ID}:result" \
            --arg title 'DW-04 calibration READY' \
            --arg summary "${summary}" \
            '{name:$name,head_sha:$head_sha,external_id:$external_id,status:"completed",conclusion:"success",output:{title:$title,summary:$summary}}' \
            | gh api --method POST -H 'Accept: application/vnd.github+json' \
                "repos/${GITHUB_REPOSITORY}/check-runs" --input - >/dev/null

      - name: Upload complete calibration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dw04-calibration-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: artifacts/observed/dw04-calibration
          if-no-files-found: warn
          retention-days: 30
