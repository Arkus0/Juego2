name: Arkus Reviewer Verdict Adoption

on:
  repository_dispatch:
    types: [arkus_adopt_reviewer_verdict]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: reviewer-verdict-adoption-${{ github.event.client_payload.pr }}
  cancel-in-progress: false

jobs:
  adopt:
    name: Adopt exact-SHA Reviewer verdict
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout process oracle
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1

      - name: Validate request and adopt GitHub verdict
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.client_payload.pr }}
          TARGET_SHA: ${{ github.event.client_payload.target_sha }}
          REVIEW_ID: ${{ github.event.client_payload.review_id }}
          VERDICT: ${{ github.event.client_payload.verdict }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${PR:-}" =~ ^[1-9][0-9]*$ ]] || { echo "::error::invalid PR"; exit 2; }
          [[ "${TARGET_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid target SHA"; exit 2; }
          [[ "${REVIEW_ID:-}" =~ ^[0-9a-f]{32}$ ]] || { echo "::error::invalid review ID"; exit 2; }
          [[ "${VERDICT:-}" == "PASS" || "${VERDICT:-}" == "FAIL" ]] || { echo "::error::invalid verdict"; exit 2; }
          python3 scripts/reviewer_verdict_adoption.py \
            --pr "${PR}" --sha "${TARGET_SHA}" --review-id "${REVIEW_ID}" --verdict "${VERDICT}"
