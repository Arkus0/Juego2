name: H1-02 Remote Validation

on:
  # Deliberately unfiltered: central/imported MSBuild inputs and tracked-output
  # policy can be changed outside the Unity subtree.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h1-02-remote-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  remote-static:
    name: H1-02 static claim checks
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'work/wp-h1-02'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate with accepted evidence ancestry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      - name: Setup Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'

      - name: Verify exact SDK selection
        shell: bash
        run: |
          set -euo pipefail
          required="$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('global.json').read_text(encoding='utf-8'))['sdk']['version'])
          PY
          )"
          actual="$(dotnet --version)"
          test "${actual}" = "${required}" || {
            echo "::error::global.json requires ${required}; setup-dotnet selected ${actual}"
            exit 2
          }

      - name: Restore accepted MSBuild graph inputs (locked)
        run: dotnet restore Juego2.sln --locked-mode

      - name: Run H1-02 repository proof and causal negative controls
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/h1-02-static-check.py --mode remote-prep --self-test

      - name: Verify proof is non-mutating
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          echo H1_02_REMOTE_VALIDATION_GREEN
