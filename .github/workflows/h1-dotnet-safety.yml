name: H1 .NET Safety

on:
  pull_request:
    paths:
      - '.github/workflows/h1-dotnet-safety.yml'
      - 'tests/test-suite-classification.json'
      - 'scripts/test-suite.py'
      - 'tests/Arkus.Harness.Tests/H1*.cs'
      - 'src/Arkus.DesignWorld/**'
      - 'src/Arkus.EngineBridge/**'
      - 'src/Arkus.EngineBridge.UnityAuthoring/**'
      - 'src/Arkus.Game.Authoring/**'
      - 'src/Arkus.Game.Core/**'
      - 'src/Arkus.Game.Validation/**'
      - 'src/Arkus.Game.World/**'
      - 'src/Arkus.Harness.Projection/**'
      - 'src/Arkus.Harness.Protocol/**'
      - 'src/Arkus.Harness.Runtime/**'
      - 'tools/Arkus.H1.UnityHost/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arkus-h1-dotnet-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  h1-dotnet:
    name: H1 bounded .NET tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      - name: Setup Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'

      - name: Restore dependencies (locked)
        run: dotnet restore Juego2.sln --locked-mode

      - name: Build release
        run: dotnet build Juego2.sln --no-restore -c Release

      - name: Run H1 .NET test bucket
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-suite.py self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-suite.py run TRACK_H1
