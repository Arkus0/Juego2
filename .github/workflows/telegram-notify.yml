name: Telegram Notify

on:
  repository_dispatch:
    types: [arkus_notification]
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: telegram-notify-${{ github.event.comment.id || github.event.client_payload.key || github.event.pull_request.id || github.run_id }}
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, 'ARKUS_AUTOMATION_V2') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Build notification
        id: build
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys

          event_name = os.environ['GITHUB_EVENT_NAME']
          event_path = os.environ['GITHUB_EVENT_PATH']
          output_path = os.environ['GITHUB_OUTPUT']
          repo = os.environ['GITHUB_REPOSITORY']

          with open(output_path, 'a', encoding='utf-8') as out:
              out.write('send=false\n')
          with open(event_path, 'r', encoding='utf-8') as fh:
              event = json.load(fh)

          state = detail = next_wp = milestone = wp = target_sha = title = ''
          pr_number = None
          reply_markup = None

          if event_name == 'workflow_dispatch':
              message = '🔔 Arkus0/Juego2\nNotificaciones de Telegram operativas.'
          else:
              if event_name == 'repository_dispatch':
                  payload = event.get('client_payload', {})
                  marker_state = str(payload.get('state', '')).upper()
                  # REVIEW_READY is deliberately intermediate for every input
                  # transport. Only REVIEW_READY_CLOSED may launch a Reviewer.
                  if marker_state == 'REVIEW_READY':
                      sys.exit(0)
                  state = 'REVIEW_READY' if marker_state == 'REVIEW_READY_CLOSED' else marker_state
                  detail = str(payload.get('detail', '')).strip()[:420]
                  next_wp = str(payload.get('next_wp', '')).strip()[:120]
                  milestone = str(payload.get('milestone', '')).strip()[:120]
                  wp = str(payload.get('wp', '')).strip()[:120]
                  target_sha = str(payload.get('target_sha', '')).strip().lower()
                  pr_number = payload.get('pr')
              elif event_name == 'pull_request':
                  pr = event.get('pull_request', {})
                  if not pr.get('merged'):
                      sys.exit(0)
                  pr_body = pr.get('body') or ''
                  if re.search(r'^(Mode|WORKFLOW_MODE):\s*`?PROCESS_ONLY`?\s*$', pr_body, re.M | re.I):
                      sys.exit(0)
                  state = 'DOCSYNC_REQUIRED'
                  detail = 'Merge confirmado. Ejecuta DocSync antes de seleccionar el siguiente WP.'
                  target_sha = str(pr.get('merge_commit_sha') or '').strip().lower()
                  pr_number = pr.get('number')
                  title = pr.get('title') or ''
                  wp_match = re.search(r'^WP:\s*`?([^`\r\n]+?)`?\s*$', pr_body, re.M | re.I)
                  wp = (wp_match.group(1).strip() if wp_match else '').strip()[:120]
              else:
                  body = event.get('comment', {}).get('body', '')
                  fields = {}
                  for raw in body.splitlines():
                      line = raw.strip()
                      if ':' in line:
                          key, value = line.split(':', 1)
                          fields[key.strip()] = value.strip()
                  marker_state = fields.get('State', '').upper()
                  if marker_state == 'REVIEW_READY':
                      sys.exit(0)
                  state = 'REVIEW_READY' if marker_state == 'REVIEW_READY_CLOSED' else marker_state
                  detail = fields.get('Detail', '').strip()[:420]
                  next_wp = fields.get('Next WP', '').strip()[:120]
                  milestone = fields.get('Milestone', '').strip()[:120]
                  target_sha = fields.get('Target SHA', '').strip().lower()
                  issue = event.get('issue', {})
                  pr_number = issue.get('number')
                  pr_body = issue.get('body') or ''
                  title = issue.get('title') or ''
                  wp_match = re.search(r'^WP:\s*`?([^`\r\n]+?)`?\s*$', pr_body, re.M | re.I)
                  wp = (fields.get('WP') or (wp_match.group(1).strip() if wp_match else '')).strip()[:120]

              labels = {
                  'REVIEW_READY': '👷 Worker terminado',
                  'PASS_PREFLIGHT_GREEN': '✅ Reviewer PASS',
                  'REPAIR_REQUIRED': '❌ Reviewer FAIL',
                  'DOCSYNC_REQUIRED': '📚 Merge confirmado — DocSync requerido',
                  'DOCSYNC_COMPLETE': '📚 Merge + DocSync completados',
                  'MILESTONE_COMPLETE': '🏁 Hito completado',
                  'BLOCKED': '🛑 Bloqueado',
                  'HUMAN_ACTION_REQUIRED': '⚠️ Atención requerida',
              }
              if state not in labels:
                  sys.exit(0)

              subject = wp or milestone or title[:120] or (f'PR #{pr_number}' if pr_number else 'Juego2')
              if state == 'DOCSYNC_COMPLETE' and not next_wp:
                  print('DOCSYNC_COMPLETE requires a non-empty Next WP field', file=sys.stderr)
                  sys.exit(1)
              if state == 'MILESTONE_COMPLETE' and not milestone:
                  print('MILESTONE_COMPLETE requires a non-empty Milestone field', file=sys.stderr)
                  sys.exit(1)

              defaults = {
                  'REVIEW_READY': 'Candidato cerrado sobre SHA/contexto actuales; listo para un único Reviewer independiente.',
                  'PASS_PREFLIGHT_GREEN': 'PASS exacto validado; merge automático en curso. No hace falta actuar hasta la confirmación del merge.',
                  'REPAIR_REQUIRED': 'El WP vuelve a Worker sobre el mismo candidato/contrato.',
                  'DOCSYNC_REQUIRED': 'Merge confirmado. Ejecuta DocSync antes de seleccionar el siguiente WP.',
                  'DOCSYNC_COMPLETE': 'Implementación mergeada y documentación reconciliada.',
                  'MILESTONE_COMPLETE': 'Milestone aceptado y reconciliado.',
                  'BLOCKED': 'La ejecución necesita desbloqueo antes de continuar.',
                  'HUMAN_ACTION_REQUIRED': 'Se necesita intervención humana antes de continuar.',
              }
              parts = [f"{labels[state]} — {subject}", detail or defaults[state]]
              if next_wp:
                  parts.append(f'Siguiente WP: {next_wp}')
              if pr_number:
                  parts.append(f'PR #{pr_number}')

              prompt = None
              if state == 'REVIEW_READY' and pr_number and re.fullmatch(r'[0-9a-f]{40}', target_sha):
                  prompt = (
                      f'En Arkus0/Juego2, actúa como Reviewer independiente del PR #{pr_number}, SHA {target_sha}. '
                      'Reconstruye GitHub y WP/contratos; revisa y deja Reviewer verdict PASS/FAIL + Reviewed candidate SHA. No repares.'
                  )
              elif state == 'REPAIR_REQUIRED' and pr_number:
                  prompt = (
                      f'En Arkus0/Juego2, actúa como Worker de reparación del PR #{pr_number}. '
                      'Reconstruye GitHub y el último Reviewer FAIL; corrige la clase del problema, revalida, congela SHA exacto y entrega a Reviewer. No revises.'
                  )
              elif state == 'DOCSYNC_REQUIRED' and pr_number:
                  prompt = (
                      f'En Arkus0/Juego2, finaliza el PR #{pr_number}: confirma merge del SHA aceptado, reconstruye main, '
                      'haz DocSync solo documental, emite DOCSYNC_COMPLETE con Next WP válido y detente. No cambies implementación.'
                  )
              elif state == 'DOCSYNC_COMPLETE' and pr_number and next_wp.upper() != 'NONE':
                  prompt = (
                      f'En Arkus0/Juego2, actúa como Worker del Next WP indicado en DOCSYNC_COMPLETE del PR #{pr_number}. '
                      'Reconstruye main/GitHub y dependencias; implementa el WP completo, pre-review, valida, congela SHA exacto y entrega a Reviewer independiente. No revises.'
                  )
              elif state in {'BLOCKED', 'HUMAN_ACTION_REQUIRED'} and pr_number:
                  prompt = (
                      f'En Arkus0/Juego2, revisa el bloqueo del PR #{pr_number}. Reconstruye GitHub, identifica exactamente '
                      'qué requiere intervención humana y dime la acción mínima. No modifiques nada.'
                  )

              rows = []
              if prompt:
                  if len(prompt) > 256:
                      print(f'ChatGPT handoff prompt exceeds Telegram copy_text limit: {len(prompt)}', file=sys.stderr)
                      sys.exit(1)
                  parts.append('Copia el prompt y ábrelo en la app de ChatGPT.')
                  rows.append([{'text': '📋 Copiar siguiente prompt', 'copy_text': {'text': prompt}}])
              if rows:
                  reply_markup = {'inline_keyboard': rows}
              message = '\n'.join(parts)

          delimiter = 'TELEGRAM_MESSAGE_EOF'
          with open(output_path, 'a', encoding='utf-8') as out:
              out.write(f'message<<{delimiter}\n{message}\n{delimiter}\n')
              out.write('reply_markup=' + json.dumps(reply_markup, ensure_ascii=False, separators=(',', ':')) + '\n')
              out.write('send=true\n')
          PY

      - name: Check Telegram configuration
        id: config
        if: steps.build.outputs.send == 'true'
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ -z "${TELEGRAM_BOT_TOKEN}" || -z "${TELEGRAM_CHAT_ID}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Telegram secrets are not configured; notification skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Telegram message
        if: steps.build.outputs.send == 'true' && steps.config.outputs.configured == 'true'
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MESSAGE: ${{ steps.build.outputs.message }}
          REPLY_MARKUP: ${{ steps.build.outputs.reply_markup }}
        run: |
          set -euo pipefail
          BOT_TOKEN="$(printf '%s' "$TELEGRAM_BOT_TOKEN" | tr -d '\r\n')"
          CHAT_ID="$(printf '%s' "$TELEGRAM_CHAT_ID" | tr -d '[:space:]')"
          payload="$(jq -n \
            --arg chat_id "$CHAT_ID" \
            --arg text "$MESSAGE" \
            --argjson reply_markup "$REPLY_MARKUP" \
            '{chat_id: $chat_id, text: $text, disable_web_page_preview: true} + (if $reply_markup == null then {} else {reply_markup: $reply_markup} end)')"
          response="$(curl --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            --write-out '\n%{http_code}' \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage")"
          status="$(printf '%s\n' "$response" | tail -n 1)"
          body="$(printf '%s\n' "$response" | sed '$d')"
          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
            description="$(printf '%s' "$body" | jq -r '.description // "Telegram API request failed"' 2>/dev/null || true)"
            echo "Telegram API error (${status}): ${description:-Telegram API request failed}" >&2
            exit 1
          fi
