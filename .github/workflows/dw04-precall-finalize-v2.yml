          files={'scorer':'scripts/dw04-trial.py','assembler':'scripts/dw04-acceptance-assemble.py','executor':'scripts/dw04-acceptance-execute.py','audit':'scripts/dw04-acceptance-audit.py','adapter':'scripts/dw04-openrouter-luna-adapter.py','retrieval':'tools/Arkus.Dw04.Retrieval/Program.cs','assembly_workflow':'.github/workflows/dw04-assemble.yml','workflow':'.github/workflows/dw04-campaign.yml','verifier':'scripts/dw04-verify-exact-sha.sh'}; p['canonical_executor']='scripts/dw04-acceptance-execute.py'; p['canonical_workflow']='.github/workflows/dw04-campaign.yml'; p['script_blobs']={k:subprocess.check_output(['git','rev-parse',f'HEAD:{v}']).decode().strip() for k,v in files.items()}; path.write_text(json.dumps(p,ensure_ascii=False,separators=(',',':'))+'\n')
