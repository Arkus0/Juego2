          for path,key in [('scripts/dw04-trial.py','scorer'),('scripts/dw04-acceptance-assemble.py','assembler'),('scripts/dw04-acceptance-execute.py','executor'),('scripts/dw04-acceptance-audit.py','audit'),('scripts/dw04-openrouter-luna-adapter.py','adapter'),('tools/Arkus.Dw04.Retrieval/Program.cs','retrieval'),('.github/workflows/dw04-assemble.yml','assembly_workflow'),('.github/workflows/dw04-campaign.yml','workflow'),('scripts/dw04-verify-exact-sha.sh','verifier')]: assert subprocess.check_output(['git','rev-parse',f'HEAD:{path}']).decode().strip()==p['script_blobs'][key],key
