name: DW-04 DocSync Builder

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  docsync:
    if: github.event.pull_request.head.ref == 'docsync/wp-dw-04'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docsync/wp-dw-04
          fetch-depth: 0
      - name: Build exact DocSync projection
        run: python3 scripts/docsync-dw04-temp.py
      - name: Persist and self-delete builder
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/docsync-dw04-temp.yml scripts/docsync-dw04-temp.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Docs/workpacks/DW/WP-DW-04.md Docs/workpacks/DW/README.md Docs/workpacks/README.md Docs/SESSION_HANDOFF/ACCEPTED_STATE_INDEX.json Docs/evidence/WP-DW-04/DOCSYNC.md .github/workflows/docsync-dw04-temp.yml scripts/docsync-dw04-temp.py
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git commit -m 'docsync(dw-04): persist accepted structured-context trial'
          git push origin HEAD:docsync/wp-dw-04
