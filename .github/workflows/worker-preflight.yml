name: Worker Candidate Preflight

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: worker-preflight-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exact-candidate:
    name: Exact PR candidate preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PREFLIGHT_REPOSITORY: ${{ github.repository }}
      PREFLIGHT_PR: ${{ github.event.pull_request.number }}
      PREFLIGHT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      - name: Setup Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'

      - name: Prove exact PR and candidate context
        shell: bash
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate-worker-preflight-context.py --self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate-worker-preflight-context.py \
            --event-path "${GITHUB_EVENT_PATH}" \
            --checkout-sha "${checkout_sha}" \
            --expected-repository "${PREFLIGHT_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}"

      - name: Verify exact SDK selection
        shell: bash
        run: |
          set -euo pipefail
          required="$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('global.json').read_text(encoding='utf-8'))['sdk']['version'])
          PY
          )"
          actual="$(dotnet --version)"
          test "${actual}" = "${required}" || {
            echo "::error::global.json requires ${required}; setup-dotnet selected ${actual}"
            exit 2
          }

      - name: Restore dependencies (locked)
        run: dotnet restore Juego2.sln --locked-mode

      - name: Build release
        run: dotnet build Juego2.sln --no-restore -c Release

      - name: Run tests
        run: dotnet test Juego2.sln --no-build --no-restore -c Release --logger "console;verbosity=minimal"

      - name: Compile Python process checkers
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          from pathlib import Path
          for path in sorted(Path('scripts').glob('*.py')):
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY

      - name: Run process self-tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate-worker-handoff.py --self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation-context.py self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate-main-safety-trigger.py --self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate-worker-preflight-context.py --self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate-worker-preflight-contract.py --self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate-worker-preflight-contract.py

      - name: Simulate chat Worker without resolvable exact SDK
        shell: bash
        run: |
          set -euo pipefail
          fake_bin="$(mktemp -d)"
          trap 'rm -rf "${fake_bin}"' EXIT
          cat > "${fake_bin}/dotnet" <<'SH'
          #!/usr/bin/env bash
          echo 'simulated dotnet host: SDK selected by global.json is not installed' >&2
          exit 145
          SH
          chmod +x "${fake_bin}/dotnet"

          set +e
          output="$(PATH="${fake_bin}:${PATH}" bash scripts/worker-preflight.sh 2>&1)"
          status=$?
          set -e
          printf '%s\n' "${output}"

          test "${status}" -eq 10 || {
            echo "::error::simulated chat Worker returned ${status}, expected delegation exit 10"
            exit 5
          }
          grep -F "WORKER_PREFLIGHT_DELEGATION_REQUIRED" <<<"${output}" >/dev/null
          grep -F "Candidate SHA: ${PREFLIGHT_SHA}" <<<"${output}" >/dev/null
          if grep -F "WORKER_PREFLIGHT_GREEN" <<<"${output}" >/dev/null; then
            echo "::error::SDK-miss simulation incorrectly emitted local GREEN"
            exit 6
          fi
          echo "SIMULATED_CHAT_WORKER_DELEGATION_GREEN"

      - name: Reject stale candidate before issuing receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          live_sha="$(gh api "repos/${PREFLIGHT_REPOSITORY}/pulls/${PREFLIGHT_PR}" --jq '.head.sha')"
          test "${live_sha}" = "${PREFLIGHT_SHA}" || {
            echo "::error::PR #${PREFLIGHT_PR} advanced from ${PREFLIGHT_SHA} to ${live_sha}; this run is stale"
            exit 3
          }
          test "$(git rev-parse HEAD)" = "${PREFLIGHT_SHA}" || {
            echo "::error::checked-out candidate changed during delegated preflight"
            exit 4
          }

      - name: Emit exact-context GREEN receipt
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Worker delegated preflight receipt'
            echo ''
            echo '- Schema: `worker-preflight-receipt-v1`'
            echo "- Repository: \`${PREFLIGHT_REPOSITORY}\`"
            echo "- PR: \`${PREFLIGHT_PR}\`"
            echo "- Candidate SHA: \`${PREFLIGHT_SHA}\`"
            echo "- Workflow run ID: \`${GITHUB_RUN_ID}\`"
            echo "- Workflow run attempt: \`${GITHUB_RUN_ATTEMPT}\`"
            echo '- Result: `WORKER_PREFLIGHT_DELEGATED_GREEN`'
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "Repository: ${PREFLIGHT_REPOSITORY}"
          echo "PR: ${PREFLIGHT_PR}"
          echo "Candidate SHA: ${PREFLIGHT_SHA}"
          echo "Workflow run ID: ${GITHUB_RUN_ID}"
          echo "Workflow run attempt: ${GITHUB_RUN_ATTEMPT}"
          echo "WORKER_PREFLIGHT_DELEGATED_GREEN"
