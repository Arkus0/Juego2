name: Worker Candidate Preflight

# Main Safety is the normal hosted preflight for chat Workers. This workflow is
# retained only as an explicit fallback/diagnostic runner and never fires on
# ordinary PR activity.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Canonical pull request number
        required: true
        type: string
      candidate_sha:
        description: Exact 40-character candidate SHA
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  exact-candidate:
    name: Exact PR candidate preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PREFLIGHT_REPOSITORY: ${{ github.repository }}
      PREFLIGHT_PR: ${{ inputs.pr_number }}
      PREFLIGHT_SHA: ${{ inputs.candidate_sha }}
    steps:
      - name: Validate requested live candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${PREFLIGHT_PR}" =~ ^[1-9][0-9]*$ ]]
          [[ "${PREFLIGHT_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          live_sha="$(gh api "repos/${PREFLIGHT_REPOSITORY}/pulls/${PREFLIGHT_PR}" --jq '.head.sha')"
          test "${live_sha}" = "${PREFLIGHT_SHA}"
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - name: Setup Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify exact SDK selection
        shell: bash
        run: |
          set -euo pipefail
          required="$(python3 -c 'import json; print(json.load(open("global.json"))["sdk"]["version"])')"
          test "$(dotnet --version)" = "${required}"
      - name: Restore dependencies (locked)
        run: dotnet restore Juego2.sln --locked-mode
      - name: Build release
        run: dotnet build Juego2.sln --no-restore -c Release
      - name: Run tests
        run: dotnet test Juego2.sln --no-build --no-restore -c Release --logger "console;verbosity=minimal"
      - name: Run process self-tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate-worker-handoff.py --self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation-context.py self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate-main-safety-trigger.py --self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate-worker-preflight-contract.py --self-test
      - name: Reject stale candidate and emit receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PREFLIGHT_SHA}"
          live_sha="$(gh api "repos/${PREFLIGHT_REPOSITORY}/pulls/${PREFLIGHT_PR}" --jq '.head.sha')"
          test "${live_sha}" = "${PREFLIGHT_SHA}"
          echo "Repository: ${PREFLIGHT_REPOSITORY}"
          echo "PR: ${PREFLIGHT_PR}"
          echo "Candidate SHA: ${PREFLIGHT_SHA}"
          echo "Workflow run ID: ${GITHUB_RUN_ID}"
          echo "WORKER_PREFLIGHT_DELEGATED_GREEN"
