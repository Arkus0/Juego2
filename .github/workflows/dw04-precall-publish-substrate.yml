name: DW-04 Publish Pre-call Substrate
on:
  pull_request:
    types: [edited]
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: dw04-publish-precall-substrate-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.pull_request.draft == true &&
      contains(github.event.pull_request.body || '', 'DW04 publish: PRECALL_SUBSTRATE')
    runs-on: ubuntu-24.04
    env:
      OLD_FREEZE: 6239389b29447c3124bdb9a5fc2d9d2956729ff4
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Apply reviewed zero-call substrate blocks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,subprocess
          lines=pathlib.Path('.github/workflows/dw04-precall-finalize-v2.yml').read_text().splitlines(); blocks=[]; i=0
          while i<len(lines):
              if lines[i]=='        run: |':
                  i+=1; b=[]
                  while i<len(lines):
                      line=lines[i]
                      if line and not line.startswith('          '): break
                      b.append(line[10:] if line.startswith('          ') else ''); i+=1
                  blocks.append('\n'.join(b)+'\n'); continue
              i+=1
          assert len(blocks)==12,len(blocks)
          env=os.environ.copy(); env_file=pathlib.Path(env['GITHUB_ENV'])
          for n in range(8):
              script=pathlib.Path(f'/tmp/dw04-substrate-{n+1}.sh'); script.write_text(blocks[n]); print(f'EXECUTING_SUBSTRATE_BLOCK={n+1}',flush=True); subprocess.check_call(['bash',str(script)],env=env)
              if env_file.exists():
                  for line in env_file.read_text().splitlines():
                      if '=' in line and '<<' not in line:
                          k,v=line.split('=',1); env[k]=v
          subprocess.check_call(['git','push','origin',f'HEAD:{env["HEAD_BRANCH"]}'],env=env)
          PY
