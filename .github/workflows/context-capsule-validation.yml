name: Context Capsule Validation

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.agents/skills/implement-workpack/SKILL.md'
      - '.agents/skills/repair-workpack/SKILL.md'
      - '.agents/skills/validate-workpack/SKILL.md'
      - '.agents/skills/update-handoff/SKILL.md'
      - 'Docs/engineering/WORKER_REVIEW_PROTOCOL.md'
      - 'Docs/engineering/CONTEXT_BOOTSTRAP_V1.md'
      - 'Docs/engineering/CONTEXT_CAPSULE_V1.md'
      - 'Docs/engineering/context-bootstrap-profiles.json'
      - 'Docs/engineering/context-capsule-schema.json'
      - 'Docs/engineering/context-capsules/**'
      - 'Docs/research/living-world/results/PA-*.md'
      - 'Docs/workpacks/PA/WP-PA-*.md'
      - 'Docs/workpacks/HK/WP-HK-GATE.md'
      - 'Docs/workpacks/CITY/WP-CITY-03.md'
      - 'Docs/production/CITY_PRODUCT_SEED.md'
      - 'Docs/evidence/CTX-02/**'
      - 'scripts/context-capsule-check.py'
      - 'scripts/context-capsule-controls.py'
      - '.github/workflows/context-capsule-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capsule-contract:
    name: Accepted-contract capsule audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Self-test fail-closed validator
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/context-capsule-check.py --self-test

      - name: Independent material-loss controls
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/context-capsule-controls.py

      - name: Audit representative capsules and accepted PA chain
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/context-capsule-check.py --audit-index --repo-root .
