name: Arkus Process Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arkus-process-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stable-process-merge-gate:
    name: Stable process merge gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove generic router equals frozen legacy dispatchers
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/workpack-verifier.py self-test

      - name: Audit mechanical DocSync and navigation contracts
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/docsync.py self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/accepted-state-audit.py self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/accepted-state-audit.py audit

      - name: Check changed DocSync identities
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/docsync.py check-changed --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Prove complete mutable-input identity for receipt reuse
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/reuse-context.py self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/batch-b-workflow-controls.py

      - name: Prove PA-06+ selector convention stays checker-owned
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/context-capsule-check.py --self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/pa-selector-policy-controls.py
