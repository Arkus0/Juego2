name: Arkus Main Safety

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/main-safety.yml'
      - '.github/workflows/**'
      - 'global.json'
      - 'Juego2.sln'
      - '**/*.sln'
      - '**/*.csproj'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'Directory.*.props'
      - 'Directory.*.targets'
      - '**/Directory.*.props'
      - '**/Directory.*.targets'
      - '**/*.props'
      - '**/*.targets'
      - 'NuGet.config'
      - '**/NuGet.config'
      - 'packages.lock.json'
      - '**/packages.lock.json'
      - '**/*.lock.json'
      - '.editorconfig'
      - '**/.editorconfig'
      - '*.globalconfig'
      - '**/*.globalconfig'
      - '*.ruleset'
      - '**/*.ruleset'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arkus-main-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Safety build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      - name: Setup Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'

      - name: Validate Main Safety PR coverage
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate-main-safety-trigger.py --self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate-main-safety-trigger.py

      - name: Verify exact SDK selection
        shell: bash
        run: |
          set -euo pipefail
          required="$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('global.json').read_text(encoding='utf-8'))['sdk']['version'])
          PY
          )"
          actual="$(dotnet --version)"
          test "${actual}" = "${required}" || {
            echo "::error::global.json requires ${required}; setup-dotnet selected ${actual}"
            exit 2
          }

      - name: Restore dependencies (locked)
        run: dotnet restore Juego2.sln --locked-mode

      - name: Build release
        run: dotnet build Juego2.sln --no-restore -c Release

      - name: Run tests
        run: dotnet test Juego2.sln --no-build --no-restore -c Release --logger "console;verbosity=minimal"

      - name: Compile Python process checkers
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          from pathlib import Path
          for path in sorted(Path('scripts').glob('*.py')):
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY

      - name: Run process self-tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate-worker-handoff.py --self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation-context.py self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate-worker-preflight-context.py --self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate-main-safety-trigger.py --self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate-worker-preflight-contract.py --self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate-worker-preflight-contract.py
