name: DW-04 Emit Final Freeze
on:
  pull_request:
    types: [edited]
permissions:
  contents: write
  pull-requests: read
jobs:
  freeze:
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.body || '', 'DW04 freeze: FINAL_PRECALL')
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Pin canonical acceptance protocol
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test ! -e Docs/evidence/WP-DW-04/CONTEXT_ASSEMBLY.json
          python3 - <<'PY'
          import json,pathlib,subprocess
          path=pathlib.Path('Docs/evidence/WP-DW-04/ACCEPTANCE_PROTOCOL.json')
          p=json.loads(path.read_text())
          assert p['selected']==['A-CITY-01','A-CITY-02','A-CITY-03','A-PA-01','A-PA-02','A-PA-03']
          assert len(p['slots'])==36 and p['correctness']=='all_36' and p['context_reduction_min']==0.30
          assert p['model_config']['model']=='openai/gpt-5.6-luna-20260709'
          assert p['model_config']['provider_options']['routing']=={'order':['openai'],'allow_fallbacks':False,'require_parameters':True}
          assert p['acceptance_invalid_policy']=='No replacement calls in the acceptance generation. Any objective invalid prevents a 36-record PASS and is retained as campaign evidence; semantic misses are never rerun.'
          p['model_config']['run_policy']='acceptance-no-replacement; objective invalid is terminal evidence; semantic misses are never rerun'
          p['canonical_executor']='scripts/dw04-acceptance-execute.py'
          p['canonical_workflow']='.github/workflows/dw04-campaign.yml'
          files={
            'scorer':'scripts/dw04-trial.py',
            'assembler':'scripts/dw04-acceptance-assemble.py',
            'executor':'scripts/dw04-acceptance-execute.py',
            'audit':'scripts/dw04-acceptance-audit.py',
            'adapter':'scripts/dw04-openrouter-luna-adapter.py',
            'retrieval':'tools/Arkus.Dw04.Retrieval/Program.cs',
            'assembly_workflow':'.github/workflows/dw04-assemble.yml',
            'workflow':'.github/workflows/dw04-campaign.yml',
            'verifier':'scripts/dw04-verify-exact-sha.sh',
            'observer':'scripts/dw04-observe-exact-sha.sh'
          }
          p['script_blobs']={k:subprocess.check_output(['git','rev-parse',f'HEAD:{v}']).decode().strip() for k,v in files.items()}
          path.write_text(json.dumps(p,ensure_ascii=False,separators=(',',':'))+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Docs/evidence/WP-DW-04/ACCEPTANCE_PROTOCOL.json
          git commit -m 'dw04: pin final no-rerun acceptance substrate'
          echo "PROTOCOL_COMMIT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
      - name: Emit replacement freeze over pinned substrate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess,os
          path=pathlib.Path('Docs/evidence/WP-DW-04/TASK_SELECTION_FREEZE.json')
          f=json.loads(path.read_text())
          assert f['schema']=='dw04-acceptance-freeze-v3'
          assert f['selected']==['A-CITY-01','A-CITY-02','A-CITY-03','A-PA-01','A-PA-02','A-PA-03']
          plan=json.load(open('Docs/evidence/WP-DW-04/ACCEPTANCE_CONTEXT_PLAN.json'))
          q=[x['query_args'] for x in plan['context_plan']['A-PA-03']['DW'] if x['origin']=='dw_query']
          assert q==[['pa-disposition','pa01','DL-11'],['pa-disposition','pa01','DL-12'],['pa-disposition','pa01','DL-13'],['pa-disposition','pa01','DL-14']]
          f['freeze_parent']=os.environ['PROTOCOL_COMMIT']
          f['protocol_blob']=subprocess.check_output(['git','rev-parse','HEAD:Docs/evidence/WP-DW-04/ACCEPTANCE_PROTOCOL.json']).decode().strip()
          f['context_plan_blob']=subprocess.check_output(['git','rev-parse','HEAD:Docs/evidence/WP-DW-04/ACCEPTANCE_CONTEXT_PLAN.json']).decode().strip()
          f['retrieval_adapter_blob']=subprocess.check_output(['git','rev-parse','HEAD:tools/Arkus.Dw04.Retrieval/Program.cs']).decode().strip()
          f['supersedes_freeze_commit']='6239389b29447c3124bdb9a5fc2d9d2956729ff4'
          f['preexecution_amendment']='Docs/evidence/WP-DW-04/ACCEPTANCE_PREEXECUTION_AMENDMENT_04.md'
          f['proof_boundary']='Acceptance provider/model usage remains 0/36. Final replacement freeze repairs only deterministic context binding/retrieval identity: CITY programme rows are section-scoped, A-PA-03 uses typed pa-disposition for DL-11..DL-14 plus exact accepted-source rows, and all experiment executables are content-addressed. Six tasks, source oracles, CTX semantics, Luna/OpenAI effective configuration, canonical response schema, R1/R2/R3 order, 18 pairs/36 slots, all-36 correctness and >=30% saving threshold are unchanged. Acceptance invalids are terminal evidence with no replacement or semantic rerun.'
          path.write_text(json.dumps(f,ensure_ascii=False,separators=(',',':'))+'\n')
          PY
          git add Docs/evidence/WP-DW-04/TASK_SELECTION_FREEZE.json
          git commit -m 'dw04: emit final typed-disposition pre-call freeze'
          echo "FREEZE_COMMIT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
      - name: Verify freeze identities and zero-call boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,os
          f=json.load(open('Docs/evidence/WP-DW-04/TASK_SELECTION_FREEZE.json'))
          p=json.load(open('Docs/evidence/WP-DW-04/ACCEPTANCE_PROTOCOL.json'))
          assert len(p['slots'])==36
          assert p['model_config']['run_policy']=='acceptance-no-replacement; objective invalid is terminal evidence; semantic misses are never rerun'
          assert subprocess.check_output(['git','rev-parse','HEAD:Docs/evidence/WP-DW-04/ACCEPTANCE_PROTOCOL.json']).decode().strip()==f['protocol_blob']
          assert subprocess.check_output(['git','rev-parse','HEAD:Docs/evidence/WP-DW-04/ACCEPTANCE_CONTEXT_PLAN.json']).decode().strip()==f['context_plan_blob']
          assert subprocess.check_output(['git','rev-parse','HEAD:tools/Arkus.Dw04.Retrieval/Program.cs']).decode().strip()==f['retrieval_adapter_blob']
          files={'scorer':'scripts/dw04-trial.py','assembler':'scripts/dw04-acceptance-assemble.py','executor':'scripts/dw04-acceptance-execute.py','audit':'scripts/dw04-acceptance-audit.py','adapter':'scripts/dw04-openrouter-luna-adapter.py','retrieval':'tools/Arkus.Dw04.Retrieval/Program.cs','assembly_workflow':'.github/workflows/dw04-assemble.yml','workflow':'.github/workflows/dw04-campaign.yml','verifier':'scripts/dw04-verify-exact-sha.sh','observer':'scripts/dw04-observe-exact-sha.sh'}
          for key,path in files.items():
              assert subprocess.check_output(['git','rev-parse',f'HEAD:{path}']).decode().strip()==p['script_blobs'][key],key
          PY
          test ! -e Docs/evidence/WP-DW-04/CONTEXT_ASSEMBLY.json
          test ! -e scripts/dw04-execute.py
          git push origin "HEAD:${HEAD_BRANCH}"
