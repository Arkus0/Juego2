name: DW-04 Pre-call Finalization V3

on:
  pull_request:
    types: [edited]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: dw04-precall-finalize-v3-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.body || '', 'DW04 finalize: PRECALL_V3')
    runs-on: ubuntu-24.04
    env:
      OLD_FREEZE: 6239389b29447c3124bdb9a5fc2d9d2956729ff4
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      - name: Execute reviewed V2 closure blocks with environment handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,subprocess
          path=pathlib.Path('.github/workflows/dw04-precall-finalize-v2.yml')
          lines=path.read_text().splitlines()
          blocks=[]; i=0
          while i < len(lines):
              if lines[i] == '        run: |':
                  i += 1; out=[]
                  while i < len(lines):
                      line=lines[i]
                      if line and not line.startswith('          '): break
                      out.append(line[10:] if line.startswith('          ') else '')
                      i += 1
                  blocks.append('\n'.join(out)+'\n'); continue
              i += 1
          if len(blocks) != 12:
              raise SystemExit(f'unexpected V2 executable block count: {len(blocks)}')
          env=os.environ.copy(); env_file=pathlib.Path(env['GITHUB_ENV'])
          for n,block in enumerate(blocks,1):
              script=pathlib.Path(f'/tmp/dw04-precall-block-{n}.sh'); script.write_text(block); print(f'EXECUTING_PRECALL_BLOCK={n}',flush=True)
              subprocess.check_call(['bash',str(script)],env=env)
              if env_file.exists():
                  for line in env_file.read_text().splitlines():
                      if '=' in line and '<<' not in line:
                          k,v=line.split('=',1); env[k]=v
          PY
