name: Arkus Review Ready Closure

on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ["Arkus Candidate Validation"]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  close-review-ready:
    name: Review-ready terminal closure
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'github-actions[bot]') ||
      github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout process oracle
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: process-oracle
          fetch-depth: 1

      - name: Resolve current REVIEW_READY binding
        id: marker
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "issue_comment" ]]; then
            target="$(python3 - <<'PY'
          import os, re
          body = os.environ.get('COMMENT_BODY') or ''
          states = re.findall(r'^State:\s*(\S+)\s*$', body, re.M)
          shas = re.findall(r'^Target SHA:\s*([0-9a-fA-F]{40})\s*$', body, re.M)
          if body.splitlines().count('ARKUS_AUTOMATION_V2') == 1 and states == ['REVIEW_READY'] and len(shas) == 1:
              print(shas[0].lower())
          PY
          )"
            pr="${ISSUE_NUMBER}"
          else
            target="${WORKFLOW_HEAD_SHA,,}"
            pr="$(jq -r '.workflow_run.pull_requests[0].number // empty' "${GITHUB_EVENT_PATH}")"
            if [[ -z "${pr}" && "${target}" =~ ^[0-9a-f]{40}$ ]]; then
              pr="$(gh api -H 'Accept: application/vnd.github+json' \
                "repos/${GITHUB_REPOSITORY}/commits/${target}/pulls" \
                --jq '[.[] | select(.state == "open")] | .[0].number // empty')"
            fi
          fi

          if [[ ! "${target}" =~ ^[0-9a-f]{40}$ || ! "${pr}" =~ ^[1-9][0-9]*$ ]]; then
            echo "valid=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" > pr.json
          current_head="$(jq -r '.head.sha // empty' pr.json | tr '[:upper:]' '[:lower:]')"
          if [[ "${current_head}" != "${target}" ]]; then
            echo "valid=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          python3 process-oracle/scripts/validation-context.py self-test
          if ! python3 process-oracle/scripts/validation-context.py resolve \
            --pr-json pr.json --target-sha "${target}" --record current-context.json >/dev/null; then
            echo "valid=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments?per_page=100" \
            | jq '[.[][]]' > comments.json

          python3 process-oracle/scripts/review-ready-binding.py self-test
          if ! python3 process-oracle/scripts/review-ready-binding.py select \
            --comments-json comments.json \
            --pr-json pr.json \
            --context-record current-context.json \
            --target-sha "${target}" \
            --record review-binding.json \
            --marker-record marker.json >/dev/null; then
            echo "valid=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "valid=true" >> "${GITHUB_OUTPUT}"
          echo "target_sha=${target}" >> "${GITHUB_OUTPUT}"
          echo "pr=${pr}" >> "${GITHUB_OUTPUT}"
          for key in wp process_only non_foundational context_digest reuse_context_digest binding_digest validation_run_id validation_workflow review_ready_closed_key; do
            value="$(jq -r --arg key "${key}" '.[$key]' review-binding.json)"
            echo "${key}=${value}" >> "${GITHUB_OUTPUT}"
          done

      - name: Checkout exact candidate
        if: steps.marker.outputs.valid == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.marker.outputs.target_sha }}
          path: candidate
          fetch-depth: 0

      - name: Revalidate current handoff against exact candidate
        if: steps.marker.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.marker.outputs.pr }}
          TARGET_SHA: ${{ steps.marker.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" > pr-live.json
          test "$(jq -r '.head.sha' pr-live.json)" = "${TARGET_SHA}"
          python3 process-oracle/scripts/validation-context.py record-match \
            --pr-json pr-live.json --target-sha "${TARGET_SHA}" --record current-context.json >/dev/null
          cd candidate
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          export PR_BODY="$(jq -r '.body // ""' ../pr-live.json)"
          export TARGET_SHA
          python3 scripts/validate-worker-handoff.py --self-test
          python3 scripts/validate-worker-handoff.py --head-sha "${TARGET_SHA}"

      - name: Verify exact bound validation source
        id: source
        if: steps.marker.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.marker.outputs.pr }}
          TARGET_SHA: ${{ steps.marker.outputs.target_sha }}
          BINDING_DIGEST: ${{ steps.marker.outputs.binding_digest }}
          VALIDATION_RUN_ID: ${{ steps.marker.outputs.validation_run_id }}
          VALIDATION_WORKFLOW: ${{ steps.marker.outputs.validation_workflow }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100" > checks.json
          external_id="validation-context:${PR}:${TARGET_SHA}:${BINDING_DIGEST}:${VALIDATION_RUN_ID}"
          match_count="$(jq -r --arg eid "${external_id}" '[.check_runs[] | select(.name == "Validation context identity" and .conclusion == "success" and .external_id == $eid)] | length' checks.json)"
          [[ "${match_count}" -ge 1 ]] || { echo "::error::No validation identity bound to ${BINDING_DIGEST}"; exit 2; }
          jq -r --arg eid "${external_id}" '[.check_runs[] | select(.name == "Validation context identity" and .conclusion == "success" and .external_id == $eid)] | sort_by(.completed_at // .started_at // "") | last | .output.summary' checks.json > context-summary.txt
          python3 process-oracle/scripts/validation-context.py check-match \
            --pr-json pr-live.json --target-sha "${TARGET_SHA}" --summary context-summary.txt \
            --run-id "${VALIDATION_RUN_ID}" --workflow "${VALIDATION_WORKFLOW}" >/dev/null

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VALIDATION_RUN_ID}" > validation-run.json
          [[ "$(jq -r '.conclusion // empty' validation-run.json)" == "success" ]] || { echo "::error::Validation run is not successful"; exit 2; }
          [[ "$(jq -r '.name // empty' validation-run.json)" == "${VALIDATION_WORKFLOW}" ]] || { echo "::error::Validation workflow mismatch"; exit 2; }
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VALIDATION_RUN_ID}/jobs?per_page=100" > validation-jobs.json
          if [[ "${VALIDATION_WORKFLOW}" == "Arkus Candidate Validation" ]]; then
            [[ "$(jq -r '.head_sha // empty' validation-run.json)" == "${TARGET_SHA}" ]] || { echo "::error::Candidate Validation SHA mismatch"; exit 2; }
            handoff="$(jq -r '[.jobs[] | select(.name == "Worker handoff lint")] | last | .conclusion // "missing"' validation-jobs.json)"
            freeze="$(jq -r '[.jobs[] | select(.name == "Freeze exact-SHA validation")] | last | .conclusion // "missing"' validation-jobs.json)"
            [[ "${handoff}" == "success" ]] || { echo "::error::Worker handoff lint is not GREEN"; exit 2; }
            if [[ "${{ steps.marker.outputs.non_foundational }}" != "true" ]]; then
              [[ "${freeze}" == "success" ]] || { echo "::error::Freeze exact-SHA validation is not GREEN"; exit 2; }
            fi
          else
            reuse="$(jq -r '[.jobs[] | select(.name == "Reuse exact-SHA receipt for freeze")] | last | .conclusion // "missing"' validation-jobs.json)"
            [[ "${reuse}" == "success" ]] || { echo "::error::Receipt reuse job is not GREEN"; exit 2; }
          fi

      - name: Validate terminal closure oracle
        if: steps.marker.outputs.valid == 'true'
        env:
          MARKER_SHA: ${{ steps.marker.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          final_head="$(jq -r '.head.sha' pr-live.json)"
          python3 - "${MARKER_SHA}" "${final_head}" <<'PY'
          import json, re, sys
          pr = json.load(open('pr-live.json', encoding='utf-8'))
          body = pr.get('body') or ''
          def field(name):
              rows = re.findall(rf'^{re.escape(name)}:\s*`?([^`\r\n]+?)`?\s*$', body, re.M | re.I)
              return rows[0].strip() if len(rows) == 1 else ''
          state = {
              'pr_draft': bool(pr.get('draft')),
              'pr_head_sha': pr['head']['sha'].lower(),
              'candidate_sha': field('Candidate HEAD SHA'),
              'frozen_sha': field('Frozen candidate SHA'),
              'worker_state': field('Worker state'),
              'worker_pre_review': field('Worker pre-review'),
              'branch_frozen': field('Branch frozen'),
              'worker_verdict': field('Worker verdict'),
              'reviewer_verdict': field('Reviewer verdict'),
              'handoff_check': 'success',
              'freeze_check': 'success',
              'marker_sha': sys.argv[1],
              'final_head_sha': sys.argv[2],
          }
          json.dump(state, open('review-ready-state.json', 'w', encoding='utf-8'), indent=2)
          PY
          python3 candidate/scripts/review-ready-closure.py --self-test
          python3 candidate/scripts/review-ready-closure.py --state-json review-ready-state.json

      - name: Persist single terminal Reviewer handoff
        if: steps.marker.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.marker.outputs.pr }}
          TARGET_SHA: ${{ steps.marker.outputs.target_sha }}
          WP: ${{ steps.marker.outputs.wp }}
          CONTEXT_DIGEST: ${{ steps.marker.outputs.context_digest }}
          REUSE_CONTEXT_DIGEST: ${{ steps.marker.outputs.reuse_context_digest }}
          BINDING_DIGEST: ${{ steps.marker.outputs.binding_digest }}
          CLOSED_KEY: ${{ steps.marker.outputs.review_ready_closed_key }}
          VALIDATION_RUN_ID: ${{ steps.marker.outputs.validation_run_id }}
          VALIDATION_WORKFLOW: ${{ steps.marker.outputs.validation_workflow }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" > pr-final.json
          test "$(jq -r '.head.sha' pr-final.json)" = "${TARGET_SHA}"
          python3 process-oracle/scripts/validation-context.py record-match \
            --pr-json pr-final.json --target-sha "${TARGET_SHA}" --record current-context.json >/dev/null

          if gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" --paginate --jq '.[].body' | grep -Fq "Key: ${CLOSED_KEY}"; then
            exit 0
          fi

          body=$(cat <<EOF
          ARKUS_AUTOMATION_V2
          State: REVIEW_READY_CLOSED
          Key: ${CLOSED_KEY}
          Target SHA: ${TARGET_SHA}
          Validation Context Digest: ${CONTEXT_DIGEST}
          Reuse Context Digest: ${REUSE_CONTEXT_DIGEST}
          Review Binding Digest: ${BINDING_DIGEST}
          Validation Run ID: ${VALIDATION_RUN_ID}
          Validation Workflow: ${VALIDATION_WORKFLOW}
          Detail: durable REVIEW_READY and its exact validation source remain current under the final live PR identity. Independent Reviewer judgment is still required.
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="${body}" >/dev/null

          jq -n \
            --arg state "REVIEW_READY_CLOSED" --arg key "${CLOSED_KEY}" --arg wp "${WP}" \
            --arg detail "terminal REVIEW_READY closure is current; start one fresh independent Reviewer" \
            --arg target_sha "${TARGET_SHA}" --arg binding_digest "${BINDING_DIGEST}" --argjson pr "${PR}" \
            '{event_type:"arkus_notification",client_payload:{state:$state,key:$key,wp:$wp,detail:$detail,target_sha:$target_sha,binding_digest:$binding_digest,pr:$pr}}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input - >/dev/null
