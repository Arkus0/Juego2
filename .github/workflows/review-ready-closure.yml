name: Arkus Review Ready Closure

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  close-review-ready:
    name: Review-ready terminal closure
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Parse Automation V2 marker
        id: marker
        env:
          BODY: ${{ github.event.comment.body || '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import os, re
          body = os.environ.get("BODY", "")
          state = re.search(r"^State:\s*(\S+)\s*$", body, re.M)
          target = re.search(r"^Target SHA:\s*([0-9a-fA-F]{40})\s*$", body, re.M)
          automation = any(line.strip() == "ARKUS_AUTOMATION_V2" for line in body.splitlines())
          valid = automation and state is not None and state.group(1) == "REVIEW_READY" and target is not None
          print(f"valid={'true' if valid else 'false'}")
          print(f"target_sha={target.group(1).lower() if valid else ''}")
          PY

      - name: Read canonical PR after marker
        if: steps.marker.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" > pr.json

      - name: Checkout live PR HEAD
        if: steps.marker.outputs.valid == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ fromJSON('pr.json').head.sha }}
          fetch-depth: 0

      - name: Re-read PR and run canonical handoff oracle
        if: steps.marker.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" > pr.json
          head_sha="$(jq -r '.head.sha' pr.json)"
          export TARGET_SHA="${head_sha}"
          export PR_BODY="$(jq -r '.body // ""' pr.json)"
          python3 scripts/validate-worker-handoff.py --self-test
          python3 scripts/validate-worker-handoff.py --head-sha "${head_sha}"

      - name: Build post-marker closure state
        if: steps.marker.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
          MARKER_SHA: ${{ steps.marker.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(jq -r '.head.sha' pr.json)"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs?per_page=100" > checks.json

          handoff="$(jq -r '[.check_runs[] | select(.name == "Worker handoff lint")] | sort_by(.completed_at // .started_at // "") | reverse | .[0].conclusion // "missing"' checks.json)"
          freeze="$(jq -r '[.check_runs[] | select(.name == "Freeze exact-SHA validation")] | sort_by(.completed_at // .started_at // "") | reverse | .[0].conclusion // "missing"' checks.json)"

          # This read is intentionally after the REVIEW_READY comment event and
          # after observing both prerequisite checks.
          final_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.head.sha')"

          python3 - "${handoff}" "${freeze}" "${MARKER_SHA}" "${final_head}" <<'PY'
          import json, re, sys
          pr = json.load(open("pr.json", encoding="utf-8"))
          body = pr.get("body") or ""
          def field(name):
              m = re.search(rf"^{re.escape(name)}:\s*`?([^`\r\n]+?)`?\s*$", body, re.M | re.I)
              return m.group(1).strip() if m else ""
          out = {
              "pr_draft": bool(pr.get("draft")),
              "pr_head_sha": pr["head"]["sha"].lower(),
              "candidate_sha": field("Candidate HEAD SHA"),
              "frozen_sha": field("Frozen candidate SHA"),
              "worker_state": field("Worker state"),
              "worker_pre_review": field("Worker pre-review"),
              "branch_frozen": field("Branch frozen"),
              "worker_verdict": field("Worker verdict"),
              "reviewer_verdict": field("Reviewer verdict"),
              "handoff_check": sys.argv[1],
              "freeze_check": sys.argv[2],
              "marker_sha": sys.argv[3],
              "final_head_sha": sys.argv[4],
          }
          json.dump(out, open("review-ready-state.json", "w", encoding="utf-8"), indent=2)
          PY

      - name: Validate terminal closure
        if: steps.marker.outputs.valid == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/review-ready-closure.py --self-test
          python3 scripts/review-ready-closure.py --state-json review-ready-state.json

      - name: Persist post-marker closure
        if: steps.marker.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
          TARGET_SHA: ${{ steps.marker.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Final race check occurs immediately before persistence.
          live_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.head.sha')"
          [[ "${live_head}" == "${TARGET_SHA}" ]] || {
            echo "::error::PR HEAD moved after terminal validation: ${live_head} != ${TARGET_SHA}"
            exit 2
          }

          key="review-ready-closed:${PR}:${TARGET_SHA}"
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" --paginate --jq '.[].body' | grep -Fq "Key: ${key}"; then
            exit 0
          fi

          body=$(cat <<EOF
          ARKUS_AUTOMATION_V2
          State: REVIEW_READY_CLOSED
          Key: ${key}
          Target SHA: ${TARGET_SHA}
          Detail: durable REVIEW_READY observed; Worker handoff lint and freeze exact-SHA validation are green; final live PR HEAD still equals the frozen SHA. Lifecycle evidence only; independent Reviewer judgment remains required.
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="${body}" >/dev/null
