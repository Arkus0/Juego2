name: Arkus Full Safety

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arkus-full-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-test:
    name: Full harness regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      - name: Setup Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'

      - name: Restore dependencies (locked)
        run: dotnet restore Juego2.sln --locked-mode

      - name: Build release
        run: dotnet build Juego2.sln --no-restore -c Release

      - name: Validate classification and run all tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-suite.py self-test
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-suite.py run ALL
