name: DW-04 Pre-call Finalization

on:
  pull_request:
    types: [edited]

permissions:
  contents: write
  pull-requests: read
  checks: read

concurrency:
  group: dw04-precall-finalize-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.body || '', 'DW04 finalize: PRECALL_V1')
    runs-on: ubuntu-24.04
    env:
      OLD_FREEZE: 1847c45f953bfea0aabebeba0a1eb76e9d4a9a6d
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout exact pre-finalization candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Prove admissible pre-call boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git merge-base --is-ancestor "${OLD_FREEZE}" HEAD
          test ! -e Docs/evidence/WP-DW-04/CONTEXT_ASSEMBLY.json
          test "$(git rev-parse HEAD:Docs/evidence/WP-DW-04/TASK_SELECTION_FREEZE.json)" = "$(git rev-parse ${OLD_FREEZE}:Docs/evidence/WP-DW-04/TASK_SELECTION_FREEZE.json)"
          test "$(jq -r '.selected|join(",")' Docs/evidence/WP-DW-04/TASK_SELECTION_FREEZE.json)" = 'A-CITY-01,A-CITY-02,A-CITY-03,A-PA-01,A-PA-02,A-PA-03'
          ! grep -Fq 'DW04 campaign: ACCEPTANCE' "${GITHUB_EVENT_PATH}"
          test "$(jq -r '.acceptance_invalid_policy' Docs/evidence/WP-DW-04/ACCEPTANCE_PROTOCOL.json)" = 'No replacement calls in the acceptance generation. Any objective invalid prevents a 36-record PASS and is retained as campaign evidence; semantic misses are never rerun.'

      - name: Repair deterministic retrieval and canonical execution substrate
        shell: bash
        run: |
          set -euo pipefail
          cat > tools/Arkus.Dw04.Retrieval/Program.cs <<'EOF'
          using System;
          using System.IO;
          using System.Linq;
          using System.Text.Json;
          using System.Text.Encodings.Web;
          using Arkus.DesignWorld;

          // Read-only adapter over accepted DW-02/03 production query providers. No oracle
          // or expected answer is imported into this route; it returns material + provenance.
          if (args.Length < 3)
              throw new ArgumentException("Usage: <repository-root> city <id> | pa-fixture <paId> <key> | pa-finding <paId> <key> | pa-disposition <paId> <key>");

          var root = Path.GetFullPath(args[0]);
          var jsonOptions = new JsonSerializerOptions { Encoder = JavaScriptEncoder.UnsafeRelaxedJsonEscaping };
          string Read(string path) => File.ReadAllText(Path.Combine(root, path.Replace('/', Path.DirectorySeparatorChar)));
          object Provenance(DesignAuthorityAnchor p) => new
          {
              p.AuthorityId, p.SourcePath, p.Anchor, p.SourceDigest, p.AnchorDigest
          };

          if (args[1] == "city" && args.Length == 3)
          {
              var source = Read(CityProductionQueryProvider.ProgrammeSourcePath);
              var dataset = new CityProductionQueryProvider().BuildAndValidate(source);
              var row = dataset.Queries.AllSubjects.Single(x => x.FactId == args[2]);
              var ledgerStart = source.IndexOf("## 4. District × location programme", StringComparison.Ordinal);
              var ledgerEnd = source.IndexOf("### 4.1 Required-domain coverage", ledgerStart, StringComparison.Ordinal);
              if (ledgerStart < 0 || ledgerEnd <= ledgerStart)
                  throw new InvalidDataException("Accepted CITY-02 §4 ledger boundaries missing");
              var sourceRow = source.Substring(ledgerStart, ledgerEnd - ledgerStart).Split('\n')
                  .Single(x => x.StartsWith("| `" + row.FactId + "` |", StringComparison.Ordinal));
              Console.WriteLine(JsonSerializer.Serialize(new
              {
                  row.FactId, row.District, row.Label, row.Importance,
                  row.SpatialDepth, row.InteriorDepth, row.ProgrammeKind,
                  SourceRow = sourceRow,
                  Provenance = Provenance(row.Provenance)
              }, jsonOptions));
              return;
          }

          if ((args[1] == "pa-fixture" || args[1] == "pa-finding" || args[1] == "pa-disposition") && args.Length == 4)
          {
              var sources = new PaAcceptedCorpusSources(
                  Read(PaProjectionManifest.Pa01Path), Read(PaProjectionManifest.Pa02Path),
                  Read(PaProjectionManifest.Pa03Path), Read(PaProjectionManifest.Pa04Path),
                  Read(PaProjectionManifest.Pa05Path), Read(PaProjectionManifest.Pa05FixturesPath));
              var dataset = new PaDesignWorldProvider().BuildAndValidate(sources);
              PaCorpusQueryRecord row = args[1] switch
              {
                  "pa-fixture" => dataset.Queries.Fixture(args[2], args[3]),
                  "pa-disposition" => dataset.Queries.ByPa(args[2], "disposition").Single(x => x.SourceKey == args[3]),
                  _ => dataset.Queries.ByPa(args[2], "finding").Single(x => x.SourceKey == args[3])
              };
              Console.WriteLine(JsonSerializer.Serialize(new
              {
                  row.FactId, row.PaId, row.RecordKind, row.SourceKey,
                  row.MaterialText, row.DispositionText,
                  Provenance = Provenance(row.Provenance)
              }, jsonOptions));
              return;
          }

          throw new ArgumentException("Unsupported retrieval query");
          EOF

          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('Docs/evidence/WP-DW-04/ACCEPTANCE_CONTEXT_PLAN.json')
          d=json.loads(p.read_text())
          for item in d['context_plan']['A-PA-03']['DW']:
              assert item['query_args'][0] == 'pa-finding', item
              item['query_args'][0] = 'pa-disposition'
          p.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':'))+'\n')

          p=pathlib.Path('scripts/dw04-trial.py')
          s=p.read_text()
          old='argv[0] in ("city", "pa-fixture", "pa-finding")'
          assert s.count(old)==1
          s=s.replace(old,'argv[0] in ("city", "pa-fixture", "pa-finding", "pa-disposition")')
          p.write_text(s)

          p=pathlib.Path('scripts/dw04-prepare-acceptance.py')
          s=p.read_text()
          for key in ('DL-11','DL-12','DL-13','DL-14'):
              old=f'["pa-finding","pa01","{key}"]'
              new=f'["pa-disposition","pa01","{key}"]'
              assert old in s
              s=s.replace(old,new)
          p.write_text(s)
          PY

          rm -f scripts/dw04-execute.py

          cat > scripts/dw04-acceptance-execute.py <<'PY'
          #!/usr/bin/env python3
          """Execute the frozen 36-call DW-04 acceptance schedule exactly once."""
          import argparse,datetime,hashlib,json,os,pathlib,subprocess,sys
          from importlib.machinery import SourceFileLoader
          ROOT=pathlib.Path(__file__).resolve().parents[1]
          trial=SourceFileLoader("dw04_trial",str(ROOT/"scripts/dw04-trial.py")).load_module(); audit=SourceFileLoader("dw04_audit",str(ROOT/"scripts/dw04-acceptance-audit.py")).load_module()
          FREEZE="Docs/evidence/WP-DW-04/TASK_SELECTION_FREEZE.json"; PROTOCOL="Docs/evidence/WP-DW-04/ACCEPTANCE_PROTOCOL.json"; PLAN="Docs/evidence/WP-DW-04/ACCEPTANCE_CONTEXT_PLAN.json"; ASSEMBLY="Docs/evidence/WP-DW-04/CONTEXT_ASSEMBLY.json"; SOURCE_ORACLES="Docs/evidence/WP-DW-04/ACCEPTANCE_SOURCE_ORACLES.json"; RETRIEVAL="tools/Arkus.Dw04.Retrieval/Program.cs"
          class ProtocolError(ValueError): pass
          def req(c,m):
              if not c: raise ProtocolError(m)
          def git(*a): return subprocess.check_output(["git",*a],cwd=ROOT,stderr=subprocess.PIPE)
          def load(c,p): return json.loads(git("show",f"{c}:{p}"))
          def blob(c,p): return git("rev-parse",f"{c}:{p}").decode().strip()
          def now(): return datetime.datetime.now(datetime.timezone.utc).isoformat()
          def compact_response(response):
              raw=response.get("raw",{})
              return {"provider_request_id":response.get("provider_request_id"),"provider_response_id":response.get("provider_response_id"),"client_request_id":response.get("client_request_id"),"model":response.get("model"),"resolved_model":response.get("resolved_model"),"resolved_provider":response.get("resolved_provider"),"provider_request_body_sha256":response.get("provider_request_body_sha256"),"usage":response.get("usage"),"raw":{"answer":raw.get("answer")}}
          def main():
              q=argparse.ArgumentParser(); q.add_argument("--freeze-commit",required=True); q.add_argument("--assembly-commit",required=True); q.add_argument("--output",required=True); q.add_argument("--raw-output",required=True); a=q.parse_args(); req(os.environ.get("DW04_CAMPAIGN_ID"),"campaign id required")
              f=load(a.freeze_commit,FREEZE); f["freeze_commit"]=a.freeze_commit; f["freeze_blob"]=blob(a.freeze_commit,FREEZE); req(blob(a.freeze_commit,PROTOCOL)==f["protocol_blob"]==blob("HEAD",PROTOCOL),"protocol drift"); req(blob(a.freeze_commit,PLAN)==f["context_plan_blob"]==blob("HEAD",PLAN),"plan drift"); p=load(a.freeze_commit,PROTOCOL); plan=load(a.freeze_commit,PLAN); so=load(f["acceptance_oracle_commit"],SOURCE_ORACLES)
              req(p.get("canonical_executor")=="scripts/dw04-acceptance-execute.py" and p.get("canonical_workflow")==".github/workflows/dw04-campaign.yml","canonical acceptance route drift")
              req(blob(a.freeze_commit,"scripts/dw04-acceptance-execute.py")==p["script_blobs"]["executor"]==blob("HEAD","scripts/dw04-acceptance-execute.py"),"executor drift"); req(blob(a.freeze_commit,"scripts/dw04-openrouter-luna-adapter.py")==p["script_blobs"]["adapter"]==blob("HEAD","scripts/dw04-openrouter-luna-adapter.py"),"adapter drift"); req(blob(a.freeze_commit,RETRIEVAL)==p["script_blobs"]["retrieval"]==blob("HEAD",RETRIEVAL),"retrieval drift")
              assembly=audit.check_structure(f,p,plan,a.assembly_commit); out=pathlib.Path(a.output); rawout=pathlib.Path(a.raw_output); req(not out.exists() and not rawout.exists(),"acceptance evidence path exists; rerun forbidden"); adapter=ROOT/"scripts/dw04-openrouter-luna-adapter.py"; count=0; fd=os.open(out,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600); rfd=os.open(rawout,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
              with os.fdopen(fd,"w",encoding="utf-8") as log, os.fdopen(rfd,"w",encoding="utf-8") as rawlog:
                  for slot in p["slots"]:
                      t=slot["task"]; task=p["tasks"][t]; rc=audit.response_contract(p,so,t); ctx=assembly["contexts"][t][slot["route"]]; request=dict(p["model_config"]); request.update({"task_prompt":task["prompt"],"response_contract":rc,"system_prompt":p["system_prompt"],"slot":slot,"context_fragments":ctx,"seed":p["pair_seeds"][slot["pair"]]}); trial.check_request(request,p["model_config"],slot,task["prompt"],rc,p["system_prompt"],p["pair_seeds"][slot["pair"]])
                      started=now(); cp=subprocess.run([sys.executable,str(adapter)],input=trial.canonical(request),cwd=ROOT,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=p["timeout_seconds"],check=False); ended=now(); base={"slot":slot,"request":request,"request_sha256":trial.digest(trial.canonical(request)),"started":started,"ended":ended,"freeze_commit":a.freeze_commit,"freeze_blob":f["freeze_blob"],"assembly_commit":a.assembly_commit,"assembly_blob":blob(a.assembly_commit,ASSEMBLY),"injected_source_bytes":sum(len(x["text"].encode()) for x in ctx)}
                      if cp.returncode or not cp.stdout:
                          invalid={**base,"state":"RUN_INVALID_TERMINAL","exit_code":cp.returncode,"stderr_sha256":hashlib.sha256(cp.stderr).hexdigest(),"stderr_excerpt":cp.stderr.decode("utf-8",errors="replace")[:1200]}; rawlog.write(json.dumps({"slot":slot,"invalid":invalid},ensure_ascii=False)+"\n"); rawlog.flush(); log.write(json.dumps(invalid,ensure_ascii=False)+"\n"); log.flush(); raise ProtocolError("provider invalid; frozen acceptance policy permits no replacement call")
                      response=json.loads(cp.stdout); req(response.get("provider_request_id") and response.get("resolved_provider")=="OpenAI" and response.get("model")==p["model_config"]["model"],"provider identity drift"); rawlog.write(json.dumps({"slot":slot,"response":response},ensure_ascii=False)+"\n"); rawlog.flush(); base.update({"response":compact_response(response)}); log.write(json.dumps(base,ensure_ascii=False)+"\n"); log.flush(); count+=1
              req(count==36,"acceptance campaign incomplete"); print("DW04_ACCEPTANCE_36_RECORDED")
          if __name__=="__main__":
              try: main()
              except (ProtocolError,trial.ProtocolError,audit.ProtocolError,subprocess.CalledProcessError,subprocess.TimeoutExpired,OSError,KeyError,ValueError,json.JSONDecodeError) as e: print("DW04 ACCEPTANCE EXECUTION BLOCKED: "+str(e),file=sys.stderr); sys.exit(1)
          PY
          chmod +x scripts/dw04-acceptance-execute.py

          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('scripts/dw04-acceptance-assemble.py')
          s=p.read_text()
          old='prov=obj.get("Provenance") or {}; require(prov.get("SourcePath")==path,f"query provenance mismatch: {item[\'id\']}"); return {"id":item["id"],"source_path":path,"source_blob":authority[path],"origin":"dw_query","selector":item["selector"],"text":text,"query_receipt":{"args":item["query_args"],"output_sha256":sha(text),"provenance":prov}}'
          new='prov=obj.get("Provenance") or {}; src=source(baseline,path); require(prov.get("SourcePath")==path and prov.get("SourceDigest")==sha(src),f"query provenance mismatch: {item[\'id\']}"); return {"id":item["id"],"source_path":path,"source_blob":authority[path],"source_sha256":sha(src),"origin":"dw_query","selector":item["selector"],"text":text,"query_receipt":{"args":item["query_args"],"output_sha256":sha(text),"provenance":prov}}'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY

          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('scripts/dw04-acceptance-audit.py')
          s=p.read_text()
          old='for path,key in (("scripts/dw04-trial.py","scorer"),("scripts/dw04-acceptance-assemble.py","assembler"),("scripts/dw04-acceptance-execute.py","executor"),("scripts/dw04-acceptance-audit.py","audit"),("scripts/dw04-openrouter-luna-adapter.py","adapter"),(".github/workflows/dw04-campaign.yml","workflow")): req(blob(fc,path)==p["script_blobs"][key]==blob("HEAD",path),f"{key} blob drift")'
          new='req(p.get("canonical_executor")=="scripts/dw04-acceptance-execute.py" and p.get("canonical_workflow")==".github/workflows/dw04-campaign.yml","canonical acceptance route drift");\n    for path,key in (("scripts/dw04-trial.py","scorer"),("scripts/dw04-acceptance-assemble.py","assembler"),("scripts/dw04-acceptance-execute.py","executor"),("scripts/dw04-acceptance-audit.py","audit"),("scripts/dw04-openrouter-luna-adapter.py","adapter"),("tools/Arkus.Dw04.Retrieval/Program.cs","retrieval"),(".github/workflows/dw04-assemble.yml","assembly_workflow"),(".github/workflows/dw04-campaign.yml","workflow"),("scripts/dw04-verify-exact-sha.sh","verifier")): req(blob(fc,path)==p["script_blobs"][key]==blob("HEAD",path),f"{key} blob drift")'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY

          cat > .github/workflows/dw04-assemble.yml <<'EOF'
          name: DW-04 Frozen Assembly

          on:
            pull_request:
              types: [edited]

          permissions:
            contents: write
            pull-requests: read

          concurrency:
            group: dw04-assembly-pr-${{ github.event.pull_request.number }}
            cancel-in-progress: false

          jobs:
            assemble:
              if: >-
                github.event.pull_request.draft == true &&
                github.event.pull_request.head.repo.full_name == github.repository &&
                contains(github.event.pull_request.body || '', 'DW04 assembly:')
              runs-on: ubuntu-24.04
              env:
                TARGET_SHA: ${{ github.event.pull_request.head.sha }}
                HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
              steps:
                - name: Checkout exact pre-assembly candidate
                  uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
                  with:
                    ref: ${{ env.TARGET_SHA }}
                    fetch-depth: 0
                - name: Resolve and validate effective immutable freeze
                  shell: bash
                  run: |
                    set -euo pipefail
                    test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
                    freeze="$(git log -1 --format=%H "${TARGET_SHA}" -- Docs/evidence/WP-DW-04/TASK_SELECTION_FREEZE.json)"
                    test -n "${freeze}"
                    marker="DW04 assembly: ${freeze}"
                    jq -e --arg marker "${marker}" '(.pull_request.body // "") | contains($marker)' "${GITHUB_EVENT_PATH}" >/dev/null
                    test "$(git rev-parse ${freeze}:Docs/evidence/WP-DW-04/TASK_SELECTION_FREEZE.json)" = "$(git rev-parse HEAD:Docs/evidence/WP-DW-04/TASK_SELECTION_FREEZE.json)"
                    protocol_blob="$(jq -r '.protocol_blob' Docs/evidence/WP-DW-04/TASK_SELECTION_FREEZE.json)"
                    test "$(git rev-parse HEAD:Docs/evidence/WP-DW-04/ACCEPTANCE_PROTOCOL.json)" = "${protocol_blob}"
                    jq -e '.selected == ["A-CITY-01","A-CITY-02","A-CITY-03","A-PA-01","A-PA-02","A-PA-03"] and (.slots|length)==36' Docs/evidence/WP-DW-04/ACCEPTANCE_PROTOCOL.json >/dev/null
                    for spec in 'assembler scripts/dw04-acceptance-assemble.py' 'retrieval tools/Arkus.Dw04.Retrieval/Program.cs' 'assembly_workflow .github/workflows/dw04-assemble.yml'; do
                      key="${spec%% *}"; path="${spec#* }"; expected="$(jq -r --arg k "${key}" '.script_blobs[$k]' Docs/evidence/WP-DW-04/ACCEPTANCE_PROTOCOL.json)"; test "$(git rev-parse HEAD:${path})" = "${expected}"; done
                    test ! -e Docs/evidence/WP-DW-04/CONTEXT_ASSEMBLY.json
                    echo "FREEZE_COMMIT=${freeze}" >> "${GITHUB_ENV}"
                - name: Install pinned .NET SDK
                  uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
                  with:
                    global-json-file: global.json
                - name: Build frozen retrieval tool
                  run: dotnet build tools/Arkus.Dw04.Retrieval/Arkus.Dw04.Retrieval.csproj --configuration Release -m:1 --disable-build-servers
                - name: Materialize frozen contexts
                  run: python3 scripts/dw04-acceptance-assemble.py --freeze-commit "${FREEZE_COMMIT}" --output Docs/evidence/WP-DW-04/CONTEXT_ASSEMBLY.json
                - name: Prove structural completeness and byte saving before calls
                  shell: bash
                  run: |
                    set -euo pipefail
                    python3 - <<'PY'
                    import json,statistics,pathlib
                    p=pathlib.Path('Docs/evidence/WP-DW-04/CONTEXT_ASSEMBLY.json'); a=json.loads(p.read_text()); o=json.load(open('Docs/evidence/WP-DW-04/ACCEPTANCE_SOURCE_ORACLES.json'))
                    ctx=[]; dw=[]
                    for task,routes in a['contexts'].items():
                        for need in o['tasks'][task]['required_context']:
                            for route in ('CTX','DW'):
                                assert any(f['source_path']==need['source_path'] and need['literal'] in f['text'] for f in routes[route]), (task,route,need)
                        c=sum(len(f['text'].encode()) for f in routes['CTX']); d=sum(len(f['text'].encode()) for f in routes['DW']); ctx.append(c); dw.append(d); print(f'{task}: CTX={c} DW={d} saving={1-d/c:.6f}')
                    mc=statistics.median(ctx); md=statistics.median(dw); saving=1-md/mc
                    assert saving >= 0.30, 'frozen context plan misses 30% pre-call threshold'
                    a['structural']=True; a['median_ctx_bytes']=mc; a['median_dw_bytes']=md; a['saving']=saving; p.write_text(json.dumps(a,ensure_ascii=False,indent=2)+'\n')
                    print(f'MEDIAN_CTX_BYTES={mc} MEDIAN_DW_BYTES={md} SAVING={saving:.6f}')
                    PY
                - name: Commit immutable assembly evidence
                  shell: bash
                  run: |
                    set -euo pipefail
                    git config user.name 'github-actions[bot]'
                    git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                    git add Docs/evidence/WP-DW-04/CONTEXT_ASSEMBLY.json
                    git commit -m 'dw04: materialize frozen acceptance contexts'
                    git push origin "HEAD:${HEAD_BRANCH}"
          EOF

          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('.github/workflows/dw04-campaign.yml')
          s=p.read_text()
          old='freeze="$(git log --format=%H --diff-filter=A -- Docs/evidence/WP-DW-04/TASK_SELECTION_FREEZE.json | head -1)"'
          assert s.count(old)==1
          s=s.replace(old,'freeze="$(git log -1 --format=%H "${TARGET_SHA}" -- Docs/evidence/WP-DW-04/TASK_SELECTION_FREEZE.json)"')
          old='run: python3 scripts/dw04-acceptance-execute.py --freeze-commit "${DW04_FREEZE_COMMIT}" --assembly-commit "${DW04_ASSEMBLY_COMMIT}" --output artifacts/observed/dw04-acceptance/ACCEPTANCE_TRANSCRIPT.jsonl'
          assert s.count(old)==1
          s=s.replace(old,'run: python3 scripts/dw04-acceptance-execute.py --freeze-commit "${DW04_FREEZE_COMMIT}" --assembly-commit "${DW04_ASSEMBLY_COMMIT}" --output artifacts/observed/dw04-acceptance/ACCEPTANCE_TRANSCRIPT.jsonl --raw-output artifacts/observed/dw04-acceptance/ACCEPTANCE_PROVIDER_RAW.jsonl')
          claim='      - name: Claim unique durable acceptance campaign\n'
          assert s.count(claim)==1
          preflight='''      - name: Re-prove frozen pre-call substrate before campaign claim\n        shell: bash\n        run: |\n          set -euo pipefail\n          python3 - <<'PY2'\n          import importlib.machinery,json,pathlib,subprocess\n          root=pathlib.Path('.')\n          freeze=subprocess.check_output(['git','log','-1','--format=%H','--','Docs/evidence/WP-DW-04/TASK_SELECTION_FREEZE.json']).decode().strip()\n          f=json.loads(subprocess.check_output(['git','show',f'{freeze}:Docs/evidence/WP-DW-04/TASK_SELECTION_FREEZE.json']))\n          p=json.loads(subprocess.check_output(['git','show',f'{freeze}:Docs/evidence/WP-DW-04/ACCEPTANCE_PROTOCOL.json']))\n          assert p['canonical_executor']=='scripts/dw04-acceptance-execute.py' and p['canonical_workflow']=='.github/workflows/dw04-campaign.yml'\n          for path,key in [('scripts/dw04-trial.py','scorer'),('scripts/dw04-acceptance-assemble.py','assembler'),('scripts/dw04-acceptance-execute.py','executor'),('scripts/dw04-acceptance-audit.py','audit'),('scripts/dw04-openrouter-luna-adapter.py','adapter'),('tools/Arkus.Dw04.Retrieval/Program.cs','retrieval'),('.github/workflows/dw04-assemble.yml','assembly_workflow'),('.github/workflows/dw04-campaign.yml','workflow'),('scripts/dw04-verify-exact-sha.sh','verifier')]:\n              b=subprocess.check_output(['git','rev-parse',f'HEAD:{path}']).decode().strip(); assert b==p['script_blobs'][key],(key,b,p['script_blobs'][key])\n          audit=importlib.machinery.SourceFileLoader('dw04_audit','scripts/dw04-acceptance-audit.py').load_module(); plan=json.loads(subprocess.check_output(['git','show',f'{freeze}:Docs/evidence/WP-DW-04/ACCEPTANCE_CONTEXT_PLAN.json']))\n          f['freeze_commit']=freeze; f['freeze_blob']=subprocess.check_output(['git','rev-parse',f'{freeze}:Docs/evidence/WP-DW-04/TASK_SELECTION_FREEZE.json']).decode().strip(); a=audit.check_structure(f,p,plan,subprocess.check_output(['git','log','--format=%H','--diff-filter=A','--','Docs/evidence/WP-DW-04/CONTEXT_ASSEMBLY.json']).decode().splitlines()[0]); assert a.get('structural') is True and a.get('saving',0)>=0.30\n          PY2\n'''
          s=s.replace(claim,preflight+claim)
          p.write_text(s)
          PY

          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('scripts/dw04-observe-exact-sha.sh'); s=p.read_text()
