name: Arkus PROCESS_ONLY Hotfix Validation

on:
  pull_request:
    paths:
      - 'scripts/local_wp_remote_console.py'
      - 'scripts/local_wp_remote_console_core.py'
      - 'scripts/local_wp_recovery_policy.py'
      - 'scripts/local_wp_autopilot.py'
      - 'scripts/_local_wp_autopilot_core.py'
      - 'scripts/local_wp_autopilot_process.py'
      - 'scripts/local_wp_autopilot_remote.py'
      - 'scripts/local_wp_autopilot_remote_base.py'
      - 'scripts/local_wp_quota_recovery.py'
      - 'scripts/test_local_wp_short_quota_guard.py'
      - 'scripts/request_owner_decision.py'
      - 'scripts/reviewer_verdict_adoption.py'
      - 'scripts/_reviewer_verdict_adoption_core.py'
      - 'scripts/_test_local_wp_remote_console_core.py'
      - 'scripts/test_owner_decision_timeout.py'
      - 'scripts/test_process_only_hotfix.py'
      - 'scripts/test_process_only_recovery_identity.py'
      - 'scripts/test_local_wp_recovery_policy.py'
      - 'scripts/test_telegram_continue_receiver.py'
      - '.github/workflows/reviewer-verdict-adoption.yml'
      - '.github/workflows/process-only-hotfix-validation.yml'

permissions:
  contents: read

jobs:
  process-only-tests:
    name: PROCESS_ONLY console/autopilot/recovery
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Compile process scripts
        run: |
          python3 -m py_compile \
            scripts/local_wp_remote_console.py \
            scripts/local_wp_remote_console_core.py \
            scripts/local_wp_recovery_policy.py \
            scripts/local_wp_autopilot.py \
            scripts/_local_wp_autopilot_core.py \
            scripts/local_wp_autopilot_process.py \
            scripts/local_wp_autopilot_remote.py \
            scripts/local_wp_autopilot_remote_base.py \
            scripts/local_wp_quota_recovery.py \
            scripts/test_local_wp_short_quota_guard.py \
            scripts/request_owner_decision.py \
            scripts/reviewer_verdict_adoption.py \
            scripts/_reviewer_verdict_adoption_core.py \
            scripts/_test_local_wp_remote_console_core.py \
            scripts/test_owner_decision_timeout.py \
            scripts/test_process_only_hotfix.py \
            scripts/test_process_only_recovery_identity.py \
            scripts/test_local_wp_recovery_policy.py \
            scripts/test_telegram_continue_receiver.py
      - name: Owner continuation authority regressions
        run: python3 scripts/test_telegram_continue_receiver.py

      - name: Recovery and H1-06 incident regressions
        run: python3 scripts/test_local_wp_recovery_policy.py

      - name: Exact review-cycle and durable retry regressions
        run: python3 scripts/test_process_only_recovery_identity.py

      - name: Existing local autopilot suite
        run: python3 scripts/test_local_wp_autopilot.py

      - name: Existing local remote console suite
        run: python3 scripts/test_local_wp_remote_console.py

      - name: Existing Worker recovery suite
        run: python3 scripts/test_local_wp_worker_recovery.py

      - name: Short quota liveness regression
        run: python3 scripts/test_local_wp_short_quota_guard.py

      - name: Owner decision timeout regression
        run: python3 scripts/test_owner_decision_timeout.py

      - name: PROCESS_ONLY hotfix regressions
        run: python3 scripts/test_process_only_hotfix.py
