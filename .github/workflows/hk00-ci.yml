name: HK00 CI

on:
  push:
    branches:
      - wp-hk-00-v2
      - wp-hk-00-v2-chatgpt
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  CONFIGURATION: Release
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  proof:
    name: Exact-SHA foundational proof
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Verify exact candidate and pinned toolchain
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "candidate=${actual}"
          echo "expected=${CANDIDATE_SHA}"
          test "${actual}" = "${CANDIDATE_SHA}"
          test "$(dotnet --version)" = "8.0.425"
          dotnet --list-runtimes | grep -Fq 'Microsoft.NETCore.App 8.0.31 '
      - name: Run proof pipeline
        run: bash scripts/proof.sh
      - name: Require committed inventory to match observation
        run: |
          set -euo pipefail
          status="$(git status --porcelain -- Docs/evidence/WP-HK-00/inventory)"
          if [[ -n "${status}" ]]; then
            echo "Inventory drift:" >&2
            echo "${status}" >&2
            exit 1
          fi
      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hk00-proof-${{ env.CANDIDATE_SHA }}
          path: |
            artifacts/proof
            artifacts/bootstrap-proof
            Docs/evidence/WP-HK-00/inventory
          if-no-files-found: warn

  self-attacks:
    name: Causal negative controls
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Verify exact candidate and pinned toolchain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(dotnet --version)" = "8.0.425"
          dotnet --list-runtimes | grep -Fq 'Microsoft.NETCore.App 8.0.31 '
      - name: Inject, detect, reconstruct and re-prove 30 causal classes
        run: bash scripts/self-attacks/run-all-self-attacks.sh
      - name: Require committed attack summary to match
        run: |
          set -euo pipefail
          status="$(git status --porcelain -- Docs/evidence/WP-HK-00/self-attacks/results.md)"
          if [[ -n "${status}" ]]; then
            echo "Self-attack summary drift:" >&2
            echo "${status}" >&2
            exit 1
          fi
      - name: Upload attack evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hk00-self-attacks-${{ env.CANDIDATE_SHA }}
          path: |
            artifacts/self-attacks/logs
            Docs/evidence/WP-HK-00/self-attacks/results.md
          if-no-files-found: warn
