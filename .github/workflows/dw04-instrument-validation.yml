name: DW-04 Instrument Validation

on:
  pull_request:
    paths:
      - 'scripts/dw04-*.py'
      - 'tools/Arkus.Dw04.Retrieval/**'
      - 'Docs/evidence/WP-DW-04/**'
      - '.github/workflows/dw04-instrument-validation.yml'

permissions:
  contents: read

jobs:
  instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify pre-run universe, source oracles and scorer
        run: |
          python3 scripts/dw04-trial.py precheck --pre-commit ad570738613c992963668be5abd89bfdeb26b7d6
          python3 scripts/dw04-trial.py selftest
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          for name in ('CALIBRATION_ORACLES.json', 'ACCEPTANCE_SOURCE_ORACLES.json'):
              data = json.loads((root/'Docs/evidence/WP-DW-04'/name).read_text())
              for task in data['tasks'].values():
                  for item in task.get('required_context', []):
                      assert item['literal'] in (root/item['source_path']).read_text(), item
          for path in (root/'scripts').glob('dw04-*.py'):
              compile(path.read_text(), str(path), 'exec')
          PY
      - name: Compile real DW query adapter with pinned SDK
        run: dotnet build tools/Arkus.Dw04.Retrieval/Arkus.Dw04.Retrieval.csproj -c Release
      - name: Exercise accepted CITY and PA query/fallback cases
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          root = str(Path('.').resolve())
          cases = [
              (['city', 'loc.casco.shared_court'], 'Docs/production/CITY_LOCATION_PROGRAMME.md', 'SourceRow'),
              (['city', 'loc.puerto.landing'], 'Docs/production/CITY_LOCATION_PROGRAMME.md', 'SourceRow'),
              (['pa-finding', 'pa01', 'DL-11'], 'Docs/research/living-world/results/PA-01.md', 'MaterialText'),
              (['pa-fixture', 'pa04', 'NC-02'], 'Docs/research/living-world/results/PA-04.md', 'MaterialText'),
              (['pa-fixture', 'pa05', 'NC-02'], 'Docs/evidence/WP-PA-05/TRANSFER_AND_FIXTURES.md', 'MaterialText'),
          ]
          for query, path, material_field in cases:
              raw = subprocess.check_output(['dotnet', 'run', '--project', 'tools/Arkus.Dw04.Retrieval',
                                             '-c', 'Release', '--no-build', '--', root, *query])
              result = json.loads(raw)
              assert result['Provenance']['SourcePath'] == path, query
              assert result[material_field], query
          print('DW-04 typed query/source-open smoke: GREEN')
          PY
